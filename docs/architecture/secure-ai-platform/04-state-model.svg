<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><marker id="ar-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4B5563" /></marker><marker id="ar-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#1F66D1" /></marker><marker id="ar-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#17865B" /></marker><marker id="ar-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#D97706" /></marker><marker id="ar-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#7454D7" /></marker><marker id="ar-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#C0392B" /></marker><marker id="ar-navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#102A56" /></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" /><text x="800.0" y="52" font-family="Inter, Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#102A56" text-anchor="middle">Единый источник истины платформы</text><text x="800.0" y="88" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#1F66D1" text-anchor="middle">AI-функции — first-class сущности доменной модели, а не metadata сообщений чата</text><rect x="253" y="133" width="1100" height="660" rx="24" ry="24" fill="#0F172A" opacity="0.07" /><rect x="250" y="130" width="1100" height="660" rx="24" ry="24" fill="#F2FBF6" stroke="#17865B" stroke-width="3" /><rect x="563" y="179" width="480" height="96" rx="20" ry="20" fill="#0F172A" opacity="0.07" /><rect x="560" y="176" width="480" height="96" rx="20" ry="20" fill="#FFFFFF" stroke="#17865B" stroke-width="3" /><text x="800" y="216" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17865B" text-anchor="middle">yourown-chat-server</text><text x="800" y="248" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#4B5563" text-anchor="middle">source of truth</text><line x1="800" y1="272" x2="800" y2="302" stroke="#4B5563" stroke-width="2.2" /><line x1="420" y1="302" x2="1185" y2="302" stroke="#4B5563" stroke-width="2.2" /><line x1="420" y1="302" x2="420" y2="330" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><line x1="675" y1="302" x2="675" y2="330" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><line x1="930" y1="302" x2="930" y2="330" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><line x1="1185" y1="302" x2="1185" y2="330" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><rect x="318" y="335" width="210" height="62" rx="16" ry="16" fill="#0F172A" opacity="0.07" /><rect x="315" y="332" width="210" height="62" rx="16" ry="16" fill="#FFFFFF" stroke="#1F66D1" stroke-width="2" /><text x="420" y="370" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F66D1" text-anchor="middle">Conversation</text><rect x="573" y="335" width="210" height="62" rx="16" ry="16" fill="#0F172A" opacity="0.07" /><rect x="570" y="332" width="210" height="62" rx="16" ry="16" fill="#FFFFFF" stroke="#7454D7" stroke-width="2" /><text x="675" y="370" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#7454D7" text-anchor="middle">Agent Run</text><rect x="828" y="335" width="210" height="62" rx="16" ry="16" fill="#0F172A" opacity="0.07" /><rect x="825" y="332" width="210" height="62" rx="16" ry="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2" /><text x="930" y="370" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#D97706" text-anchor="middle">Approval</text><rect x="1083" y="335" width="210" height="62" rx="16" ry="16" fill="#0F172A" opacity="0.07" /><rect x="1080" y="332" width="210" height="62" rx="16" ry="16" fill="#FFFFFF" stroke="#17865B" stroke-width="2" /><text x="1185" y="370" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17865B" text-anchor="middle">Artifact</text><line x1="800" y1="394" x2="800" y2="442" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><rect x="513" y="449" width="580" height="80" rx="18" ry="18" fill="#0F172A" opacity="0.07" /><rect x="510" y="446" width="580" height="80" rx="18" ry="18" fill="#EAF2FF" stroke="#1F66D1" stroke-width="2" /><text x="800" y="480" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1F66D1" text-anchor="middle">Versioned domain events</text><text x="800" y="510" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">один порядок, idempotency, audit trail</text><line x1="800" y1="526" x2="800" y2="556" stroke="#4B5563" stroke-width="2.2" /><line x1="480" y1="556" x2="1120" y2="556" stroke="#4B5563" stroke-width="2.2" /><line x1="480" y1="556" x2="480" y2="584" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><line x1="800" y1="556" x2="800" y2="584" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><line x1="1120" y1="556" x2="1120" y2="584" stroke="#4B5563" stroke-width="2.2" marker-end="url(#ar-gray)" /><rect x="353" y="589" width="260" height="82" rx="16" ry="16" fill="#0F172A" opacity="0.07" /><rect x="350" y="586" width="260" height="82" rx="16" ry="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2" /><text x="480" y="620" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Chat projections</text><text x="480" y="646" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#4B5563" text-anchor="middle">bridge к мессенджерам</text><rect x="673" y="589" width="260" height="82" rx="16" ry="16" fill="#0F172A" opacity="0.07" /><rect x="670" y="586" width="260" height="82" rx="16" ry="16" fill="#FFFFFF" stroke="#1F66D1" stroke-width="2" /><text x="800" y="620" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F66D1" text-anchor="middle">Native clients</text><text x="800" y="646" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#4B5563" text-anchor="middle">iOS · macOS · Android · Web</text><rect x="993" y="589" width="260" height="82" rx="16" ry="16" fill="#0F172A" opacity="0.07" /><rect x="990" y="586" width="260" height="82" rx="16" ry="16" fill="#FFFFFF" stroke="#17865B" stroke-width="2" /><text x="1120" y="620" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17865B" text-anchor="middle">Analytics / Audit</text><text x="1120" y="646" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#4B5563" text-anchor="middle">отчётность и trace</text><rect x="488" y="709" width="630" height="44" rx="22" ry="22" fill="#0F172A" opacity="0.07" /><rect x="485" y="706" width="630" height="44" rx="22" ry="22" fill="#17865B" /><text x="800" y="733" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Мессенджеры получают projection, а не владеют процессом</text><rect x="205.0" y="839" width="1196" height="44" rx="22.0" ry="22.0" fill="#0F172A" opacity="0.07" /><rect x="202.0" y="836" width="1196" height="44" rx="22.0" ry="22.0" fill="#102A56" /><text x="800.0" y="864.48" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Главный объект платформы — управляемый процесс; сообщение является только одним из его представлений</text></svg>
