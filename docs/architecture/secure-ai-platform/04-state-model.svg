ont-size="15" font-weight="600" fill="#111827" text-anchor="middle">artifacts</text><line x1="360" y1="300" x2="460" y2="300" stroke="#D97706" stroke-width="2" stroke-dasharray="7 5"/><line x1="360" y1="345" x2="460" y2="345" stroke="#D97706" stroke-width="2" stroke-dasharray="7 5"/><line x1="360" y1="390" x2="460" y2="390" stroke="#D97706" stroke-width="2" stroke-dasharray="7 5"/><line x1="360" y1="435" x2="460" y2="435" stroke="#D97706" stroke-width="2" stroke-dasharray="7 5"/><rect x="245" y="485" width="330" height="64" rx="15" fill="#FFF7E8" stroke="#D97706" stroke-width="2"/><text x="410" y="515" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#D97706" text-anchor="middle">mapping IDs + reconciliation</text><text x="410" y="540" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#4B5563" text-anchor="middle">message ↔ run ↔ approval ↔ artifact</text><text x="110" y="600" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#D92D20" text-anchor="start">Типовые сбои</text><circle cx="120" cy="629" r="4" fill="#D92D20" stroke="none" stroke-width="2"/><text x="136" y="635" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#111827" text-anchor="start"><tspan x="136" dy="0">message создано, workflow ещё не существует</tspan></text><circle cx="120" cy="662" r="4" fill="#D92D20" stroke="none" stroke-width="2"/><text x="136" y="668" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#111827" text-anchor="start"><tspan x="136" dy="0">approval завершён, preview остался старым</tspan></text><circle cx="120" cy="695" r="4" fill="#D92D20" stroke="none" stroke-width="2"/><text x="136" y="701" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#111827" text-anchor="start"><tspan x="136" dy="0">события пришли в разном порядке</tspan></text><circle cx="120" cy="728" r="4" fill="#D92D20" stroke="none" stroke-width="2"/><text x="136" y="734" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#111827" text-anchor="start"><tspan x="136" dy="0">доступ отозван только в одной системе</tspan></text><circle cx="120" cy="761" r="4" fill="#D92D20" stroke="none" stroke-width="2"/><text x="136" y="767" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#111827" text-anchor="start"><tspan x="136" dy="0">offline-клиенты видят разные состояния</tspan></text><rect x="835" y="120" width="710" height="690" rx="24" fill="#EAF8F1" stroke="#17865B" stroke-width="3" filter="url(#shadow)"/><text x="1190" y="165" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#17865B" text-anchor="middle">Platform-first: единый domain state</text><rect x="985" y="210" width="410" height="105" rx="20" fill="#FFFFFF" stroke="#17865B" stroke-width="3" filter="url(#shadow)"/><text x="1190" y="255" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#17865B" text-anchor="middle">yourown-chat-server</text><text x="1190" y="285" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#4B5563" text-anchor="middle">source of truth</text><line x1="1190" y1="315" x2="875" y2="345" stroke="#1F66D1" stroke-width="2" marker-end="url(#arrow)"/><rect x="805" y="365" width="140" height="65" rx="14" fill="#FFFFFF" stroke="#1F66D1" stroke-width="2"/><text x="875" y="404" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1F66D1" text-anchor="middle">Conversation</text><line x1="1190" y1="315" x2="1045" y2="345" stroke="#7454D7" stroke-width="2" marker-end="url(#arrow)"/><rect x="975" y="365" width="140" height="65" rx="14" fill="#FFFFFF" stroke="#7454D7" stroke-width="2"/><text x="1045" y="404" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#7454D7" text-anchor="middle">Agent Run</text><line x1="1190" y1="315" x2="1215" y2="345" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><rect x="1145" y="365" width="140" height="65" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="1215" y="404" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">Approval</text><line x1="1190" y1="315" x2="1385" y2="345" stroke="#17865B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1315" y="365" width="140" height="65" rx="14" fill="#FFFFFF" stroke="#17865B" stroke-width="2"/><text x="1385" y="404" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#17865B" text-anchor="middle">Artifact</text><rect x="930" y="485" width="520" height="82" rx="17" fill="#EAF2FF" stroke="#1F66D1" stroke-width="2"/><text x="1190" y="520" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1F66D1" text-anchor="middle">Versioned domain events</text><text x="1190" y="548" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#4B5563" text-anchor="middle">один порядок, idempotency, audit trail</text><line x1="1190" y1="568" x2="940" y2="625" stroke="#D92D20" stroke-width="2" marker-end="url(#arrow)"/><rect x="845" y="640" width="190" height="80" rx="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/><text x="940" y="672" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#D92D20" text-anchor="middle"><tspan x="940" dy="0">Rocket.Chat</tspan><tspan x="940" dy="22">projection</tspan></text><line x1="1190" y1="568" x2="1190" y2="625" stroke="#1F66D1" stroke-width="2" marker-end="url(#arrow)"/><rect x="1095" y="640" width="190" height="80" rx="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/><text x="1190" y="672" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1F66D1" text-anchor="middle"><tspan x="1190" dy="0">Native clients</tspan></text><line x1="1190" y1="568" x2="1440" y2="625" stroke="#17865B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1345" y="640" width="190" height="80" rx="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/><text x="1440" y="672" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#17865B" text-anchor="middle"><tspan x="1440" dy="0">Analytics / Audit</tspan></text><rect x="915" y="750" width="550" height="38" rx="15" fill="#17865B" stroke="#17865B" stroke-width="1"/><text x="1190" y="776" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rocket.Chat получает projection, а не владеет процессом</text><rect x="260" y="835" width="1080" height="44" rx="16" fill="#102A56" stroke="#102A56" stroke-width="1"/><text x="800" y="864" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Главный объект платформы — управляемый процесс; сообщение является только одним из его представлений</text></svg>