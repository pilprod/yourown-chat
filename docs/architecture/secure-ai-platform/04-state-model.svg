<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4B5563"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F66D1"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17865B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.10"/></filter></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="800" y="50" font-family="Inter,Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#102A56" text-anchor="middle">Две модели состояния против единого источника истины</text><text x="800" y="86" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#1F66D1" text-anchor="middle">Почему AI-функции нельзя надёжно хранить как дополнение к сообщениям Rocket.Chat</text><rect x="55" y="120" width="710" height="690" rx="24" fill="#FFF0F0" stroke="#F4A6A6" stroke-width="3" filter="url(#shadow)"/><text x="410" y="165" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#D92D20" text-anchor="middle">Rocket.Chat-first: distributed state</text><rect x="100" y="210" width="260" height="250" rx="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/><text x="230" y="250" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#D92D20" text-anchor="middle">Rocket.Chat</text><rect x="135" y="280" width="190" height="30" rx="9" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="230" y="301" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#111827" text-ancho