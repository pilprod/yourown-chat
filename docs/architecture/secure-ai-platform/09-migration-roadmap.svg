<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4B5563"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F66D1"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17865B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.10"/></filter></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="800" y="50" font-family="Inter,Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#102A56" text-anchor="middle">План перехода без Big Bang migration</text><text x="800" y="86" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#1F66D1" text-anchor="middle">Сохраняем Rocket.Chat, развиваем платформу и переносим только те workloads, где есть измеримая ценность</text><line x1="150" y1="250" x2="1450" y2="250" stroke="#1F66D1" stroke-width="5"/><circle cx="190" cy="250" r="34" fill="#FFFFFF" stroke="#1F66D1" stroke-width="5"/><text x="190" y="259" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1F66D1" text-anchor="middle">1</text><rect x="75" y="320" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#1F66D1" stroke-width="2" filter="url(#shadow)"/><text x="190" y="360" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1F66D1" text-anchor="middle"><tspan x="190" dy="0">Сохранить</tspan><tspan x="190" dy="28">Rocket.Chat</tspan></text><text x="190" y="425" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle"><tspan x="190" dy="0">чаты, история,</tspan><tspan x="190" dy="22">интеграции</tspan></text><line x1="190" y1="285" x2="190" y2="320" stroke="#1F66D1" stroke-width="2"/><circle cx="465" cy="250" r="34" fill="#FFFFFF" stroke="#7454D7" stroke-width="5"/><text x="465" y="259" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#7454D7" text-anchor="middle">2</text><rect x="350" y="320" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#7454D7" stroke-width="2" filter="url(#shadow)"/><text x="465" y="360" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#7454D7" text-anchor="middle"><tspan x="465" dy="0">Native</tspan><tspan x="465" dy="28">Clients</tspan></text><text x="465" y="425" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle"><tspan x="465" dy="0">iOS → macOS →</tspan><tspan x="465" dy="22">Android / Web</tspan></text><line x1="465" y1="285" x2="465" y2="320" stroke="#7454D7" stroke-width="2"/><circle cx="740" cy="250" r="34" fill="#FFFFFF" stroke="#D97706" stroke-width="5"/><text x="740" y="259" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#D97706" text-anchor="middle">3</text><rect x="625" y="320" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/><text x="740" y="360" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#D97706" text-anchor="middle"><tspan x="740" dy="0">Platform</tspan><tspan x="740" dy="28">Services</tspan></text><text x="740" y="425" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle"><tspan x="740" dy="0">AI, MCP,</tspan><tspan x="740" dy="22">workflow, policy</tspan></text><line x1="740" y1="285" x2="740" y2="320" stroke="#D97706" stroke-width="2"/><circle cx="1015" cy="250" r="34" fill="#FFFFFF" stroke="#17865B" stroke-width="5"/><text x="1015" y="259" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#17865B" text-anchor="middle">4</text><rect x="900" y="320" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#17865B" stroke-width="2" filter="url(#shadow)"/><text x="1015" y="360" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#17865B" text-anchor="middle"><tspan x="1015" dy="0">Independent</tspan><tspan x="1015" dy="28">Backend</tspan></text><text x="1015" y="425" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle"><tspan x="1015" dy="0">identity, messaging,</tspan><tspan x="1015" dy="22">realtime, files</tspan></text><line x1="1015" y1="285" x2="1015" y2="320" stroke="#17865B" stroke-width="2"/><circle cx="1290" cy="250" r="34" fill="#FFFFFF" stroke="#102A56" stroke-width="5"/><text x="1290" y="259" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#102A56" text-anchor="middle">5</text><rect x="1175" y="320" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#102A56" stroke-width="2" filter="url(#shadow)"/><text x="1290" y="360" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#102A56" text-anchor="middle"><tspan x="1290" dy="0">Selective</tspan><tspan x="1290" dy="28">Migration</tspan></text><text x="1290" y="425" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle"><tspan x="1290" dy="0">только workloads</tspan><tspan x="1290" dy="22">с business value</tspan></text><line x1="1290" y1="285" x2="1290" y2="320" stroke="#102A56" stroke-width="2"/><text x="105" y="530" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#102A56" text-anchor="start">Exit criteria</text><circle cx="130" cy="560" r="16" fill="#EAF2FF" stroke="#1F66D1" stroke-width="2"/><text x="130" y="566" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F66D1" text-anchor="middle">1</text><text x="165" y="565" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Zero disruption</text><text x="460" y="565" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="start">текущие users и integrations работают</text><circle cx="130" cy="608" r="16" fill="#EAF2FF" stroke="#1F66D1" stroke-width="2"/><text x="130" y="614" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F66D1" text-anchor="middle">2</text><text x="165" y="613" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Client abstraction</text><text x="460" y="613" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="start">UI не зависит от одного backend</text><circle cx="130" cy="656" r="16" fill="#EAF2FF" stroke="#1F66D1" stroke-width="2"/><text x="130" y="662" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F66D1" text-anchor="middle">3</text><text x="165" y="661" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Platform source of truth</text><text x="460" y="661" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="start">AI/workflow state живёт вне Rocket.Chat</text><circle cx="130" cy="704" r="16" fill="#EAF2FF" stroke="#1F66D1" stroke-width="2"/><text x="130" y="710" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F66D1" text-anchor="middle">4</text><text x="165" y="709" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Feature parity target</text><text x="460" y="709" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="start">поддержаны нужные chat domains</text><circle cx="130" cy="752" r="16" fill="#EAF2FF" stroke="#1F66D1" stroke-width="2"/><text x="130" y="758" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F66D1" text-anchor="middle">5</text><text x="165" y="757" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Measured migration</text><text x="460" y="757" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B5563" text-anchor="start">миграция даёт security/cost/reliability benefit</text><rect x="180" y="825" width="1240" height="48" rx="16" fill="#17865B" stroke="#17865B" stroke-width="1"/><text x="800" y="856" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Данные мигрируются не из-за смены бренда мессенджера, а только при доказанной продуктовой и операционной выгоде</text></svg>