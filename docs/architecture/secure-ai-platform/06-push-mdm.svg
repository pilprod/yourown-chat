"650" y2="462" stroke="#7454D7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="840" y1="462" x2="960" y2="462" stroke="#7454D7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1150" y1="462" x2="1240" y2="462" stroke="#7454D7" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800" y="624" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">Policy удаляет sensitive details до отправки на lock screen</text><rect x="90" y="640" width="190" height="75" rx="14" fill="#FFF7E8" stroke="#D97706" stroke-width="2"/><text x="185" y="668" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#102A56" text-anchor="middle"><tspan x="185" dy="0">Critical</tspan><tspan x="185" dy="21">Service</tspan></text><text x="185" y="707" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">alert / logs</text><rect x="340" y="640" width="190" height="75" rx="14" fill="#FFF7E8" stroke="#D97706" stroke-width="2"/><text x="435" y="668" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#102A56" text-anchor="middle"><tspan x="435" dy="0">Policy</tspan><tspan x="435" dy="21">Engine</tspan></text><text x="435" y="707" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">classify + redact</text><rect x="650" y="640" width="190" height="75" rx="14" fill="#FFF7E8" stroke="#D97706" stroke-width="2"/><text x="745" y="668" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#102A56" text-anchor="middle"><tspan x="745" dy="0">Push</tspan><tspan x="745" dy="21">Provider</tspan></text><text x="745" y="707" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#4B5563" text-anchor="middle">generic alert</text><rect x="960" y="640" width="190" height="75" rx="14" fill="#FFF