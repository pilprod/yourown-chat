{{- if eq .Values.environment "dev" }}
# Dev Mattermost (Team Edition), run as a plain Deployment (no operator) to keep
# dev lightweight. Local filestore on a 10Gi PVC, backed by the in-cluster
# Postgres. Low priority on the shared node pool. The DB password is injected from the
# CSI-synced `dev-postgres` Secret and expanded into the datasource by Kubelet's
# $(VAR) substitution.
apiVersion: v1
kind: Service
metadata:
  name: dev-mattermost
  namespace: dev
  labels:
    app: dev-mattermost
spec:
  selector:
    app: dev-mattermost
  ports:
    - name: http
      port: 8065
      targetPort: 8065
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-mattermost-data
  namespace: dev
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-mattermost
  namespace: dev
  labels:
    app: dev-mattermost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dev-mattermost
  template:
    metadata:
      labels:
        app: dev-mattermost
    spec:
      serviceAccountName: dev-app
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext:
        fsGroup: 2000
      containers:
        - name: mattermost
          # Custom (patched) image built by the image-CI components (terraform/)
          # on git tags matching ^v.*-patched$ and pushed to the unified
          # registry. Cloud Deploy freezes the tag to repository@sha256 before
          # rendering, so replacing a mutable tag always changes the pod
          # template and the exact same digest is promoted to production.
          image: {{ required "Cloud Deploy parameter mattermost_dev_image is required" .Values.mattermost_dev_image | quote }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-postgres
                  key: POSTGRES_PASSWORD
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              value: "postgres://mmuser:$(POSTGRES_PASSWORD)@dev-postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
            - name: MM_FILESETTINGS_DRIVERNAME
              value: local
            - name: MM_FILESETTINGS_DIRECTORY
              value: /mattermost/data
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://dev.yourown.chat
            - name: MM_GOOGLESETTINGS_ENABLE
              value: {{ .Values.mattermost_google_auth_enabled | quote }}
            - name: MM_GOOGLESETTINGS_ID
              valueFrom:
                secretKeyRef:
                  name: dev-mattermost-google-auth
                  key: client-id
            - name: MM_GOOGLESETTINGS_SECRET
              valueFrom:
                secretKeyRef:
                  name: dev-mattermost-google-auth
                  key: client-secret
            - name: MM_GOOGLESETTINGS_DISCOVERYENDPOINT
              value: "https://accounts.google.com/.well-known/openid-configuration"
            - name: MM_GOOGLESETTINGS_SCOPE
              value: "openid email profile"
            - name: MM_GOOGLESETTINGS_BUTTONTEXT
              value: "Continue with Google"
            - name: MM_GOOGLESETTINGS_ALLOWEDHOSTEDDOMAINS
              value: {{ .Values.mattermost_google_hosted_domains | quote }}
            - name: MM_GOOGLESETTINGS_ALLOWEDDOMAINS
              value: {{ .Values.mattermost_google_email_domains | quote }}
            - name: MM_TEAMSETTINGS_RESTRICTCREATIONTODOMAINS
              value: {{ .Values.mattermost_google_email_domains | quote }}
            {{- if .Values.mattermost_smtp_enabled }}
            # Same IP-authenticated Workspace relay as prod, with a distinct
            # sender so test invitations are immediately identifiable.
            - name: MM_SERVICESETTINGS_ENABLEEMAILINVITATIONS
              value: "true"
            - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
              value: "true"
            - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
              value: "false"
            - name: MM_EMAILSETTINGS_SMTPSERVER
              value: {{ required "mattermost_smtp_server is required when SMTP is enabled" .Values.mattermost_smtp_server | quote }}
            - name: MM_EMAILSETTINGS_SMTPPORT
              value: {{ required "mattermost_smtp_port is required when SMTP is enabled" .Values.mattermost_smtp_port | quote }}
            - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
              value: {{ required "mattermost_smtp_connection_security is required when SMTP is enabled" .Values.mattermost_smtp_connection_security | quote }}
            - name: MM_EMAILSETTINGS_FEEDBACKNAME
              value: {{ required "mattermost_smtp_feedback_name is required when SMTP is enabled" .Values.mattermost_smtp_feedback_name | quote }}
            - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
              value: {{ required "mattermost_smtp_feedback_email is required when SMTP is enabled" .Values.mattermost_smtp_feedback_email | quote }}
            - name: MM_EMAILSETTINGS_REPLYTOADDRESS
              value: {{ required "mattermost_smtp_reply_to is required when SMTP is enabled" .Values.mattermost_smtp_reply_to | quote }}
            - name: MM_EMAILSETTINGS_SKIPSERVERCERTIFICATEVERIFICATION
              value: "false"
            {{- end }}
          ports:
            - containerPort: 8065
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /mattermost/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dev-mattermost-data
{{- end }}
