{{- if eq .Values.environment "prod" }}
# Prod Mattermost (Mattermost Operator CR; operator + CRDs installed first).
# Pinned to the prod node pool. DB (Cloud SQL) and filestore (GCS) are external
# Secrets created directly in etcd by Terraform (app-gcp cluster_secrets), never
# through Cloud Deploy. Ingress: public yourown.chat behind Cloudflare, with
# Full (Strict) TLS + optional AOP mTLS. Image built by the image-CI on
# ^v.*-patched$ tags; dynamic values are injected through Cloud Deploy's Helm
# --set deploy parameters.
apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
  namespace: mattermost
spec:
  # The operator recognizes a sha256-prefixed version and assembles the
  # immutable ref as "<image>@<version>". This makes the resulting Deployment
  # pod template change even when a source tag was rebuilt in the registry.
  image: "europe-west3-docker.pkg.dev/yourown-chat/docker/mattermost"
  version: {{ required "Cloud Deploy parameter mattermost_version is required" .Values.mattermost_version | quote }}
  replicas: 1

  # Keep the existing replica serving until its replacement is Ready. The
  # operator renders RollingUpdate with maxSurge=1 and maxUnavailable=0, so a
  # release temporarily schedules two pods and never tears the old one down
  # first.
  deploymentTemplate:
    deploymentStrategyType: RollingUpdate

  ingress:
    enabled: true
    host: "yourown.chat"
    ingressClass: nginx
    tlsSecret: mattermost-origin-tls
    annotations:
      # AOP mTLS toggle. verify-client "on" requires the cloudflare-origin-pull-ca
      # Secret; "off" = Full (Strict) TLS only. The auth-tls-secret is loaded by
      # nginx regardless of verify-client, so the CA Secret must always exist.
      nginx.ingress.kubernetes.io/auth-tls-verify-client: {{ required "Cloud Deploy parameter aop_verify_client is required" .Values.aop_verify_client | quote }}
      nginx.ingress.kubernetes.io/auth-tls-secret: "mattermost/cloudflare-origin-pull-ca"
      nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

  database:
    external:
      secret: mattermost-db

  fileStore:
    external:
      url: storage.googleapis.com
      bucket: {{ required "Cloud Deploy parameter filestore_bucket is required" .Values.filestore_bucket | quote }}
      secret: mattermost-filestore

  scheduling:
    resources:
      requests:
        # Kubernetes CPU quantities have 1m precision, so half of 25m is
        # rounded up rather than below the requested 50% target.
        cpu: 13m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
{{- end }}
