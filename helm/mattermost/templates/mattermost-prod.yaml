{{- if eq .Values.environment "prod" }}
# Prod Mattermost (Mattermost Operator CR; operator + CRDs installed first).
# Pinned to the prod node pool. DB (Cloud SQL) and filestore (GCS) are external
# Secrets created directly in etcd by Terraform (app-gcp cluster_secrets), never
# through Cloud Deploy. Ingress: public yourown.chat behind Cloudflare, with
# Full (Strict) TLS + optional AOP mTLS. Image built by the image-CI on
# ^v.*-patched$ tags; dynamic values are injected through Cloud Deploy's Helm
# --set deploy parameters.
apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
  namespace: mattermost
spec:
  # The operator recognizes a sha256-prefixed version and assembles the
  # immutable ref as "<image>@<version>". This makes the resulting Deployment
  # pod template change even when a source tag was rebuilt in the registry.
  image: "europe-west3-docker.pkg.dev/yourown-chat/docker/mattermost"
  version: {{ required "Cloud Deploy parameter mattermost_version is required" .Values.mattermost_version | quote }}
  replicas: 1

  mattermostEnv:
    # Keep product identity and user display policy declarative. Environment
    # variables intentionally make these settings read-only in System Console.
    - name: MM_GUESTACCOUNTSSETTINGS_ENABLE
      value: {{ .Values.mattermost_guest_access_enabled | quote }}
    - name: MM_TEAMSETTINGS_SITENAME
      value: {{ required "mattermost_site_name is required" .Values.mattermost_site_name | quote }}
    - name: MM_TEAMSETTINGS_TEAMMATENAMEDISPLAY
      value: {{ required "mattermost_teammate_name_display is required" .Values.mattermost_teammate_name_display | quote }}
    - name: MM_TEAMSETTINGS_LOCKTEAMMATENAMEDISPLAY
      value: {{ .Values.mattermost_lock_teammate_name_display | quote }}
    {{- if .Values.mattermost_calls_enabled }}
    # Calls v1.12.1 is prepackaged and already active in the product image.
    # Keep the plugin framework and Calls policy declarative while RTCD handles
    # all WebRTC media outside the Mattermost application pod.
    - name: MM_PLUGINSETTINGS_ENABLE
      value: "true"
    - name: MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS
      value: "true"
    # PluginStates is a map, so Mattermost accepts it only as one JSON
    # environment override. Flattened keys below the map are silently ignored.
    # Preserve the 11.9 defaults while making Calls activation immutable.
    - name: MM_PLUGINSETTINGS_PLUGINSTATES
      value: '{"com.mattermost.nps":{"Enable":true},"com.mattermost.calls":{"Enable":true},"playbooks":{"Enable":true},"mattermost-ai":{"Enable":true}}'
    - name: MM_CALLS_RTCD_SERVICE_URL
      value: "http://mattermost-rtcd.mattermost-rtcd.svc.cluster.local:8045"
    - name: MM_CALLS_DEFAULT_ENABLED
      value: {{ .Values.mattermost_calls_default_enabled | quote }}
    - name: MM_CALLS_ALLOW_SCREEN_SHARING
      value: {{ .Values.mattermost_calls_allow_screen_sharing | quote }}
    - name: MM_CALLS_MAX_CALL_PARTICIPANTS
      value: {{ .Values.mattermost_calls_max_participants | quote }}
    {{- end }}
    # Native TOTP protects email/password accounts. Keep enforcement disabled
    # for the first rollout so existing users can enroll. Google SSO users must
    # have 2-Step Verification enforced by Google Workspace.
    - name: MM_SERVICESETTINGS_ENABLEMULTIFACTORAUTHENTICATION
      value: {{ .Values.mattermost_mfa_enabled | quote }}
    - name: MM_SERVICESETTINGS_ENFORCEMULTIFACTORAUTHENTICATION
      value: {{ .Values.mattermost_mfa_enforced | quote }}
    - name: MM_GOOGLESETTINGS_ENABLE
      value: {{ .Values.mattermost_google_auth_enabled | quote }}
    - name: MM_GOOGLESETTINGS_ID
      valueFrom:
        secretKeyRef:
          name: mattermost-google-auth
          key: client-id
    - name: MM_GOOGLESETTINGS_SECRET
      valueFrom:
        secretKeyRef:
          name: mattermost-google-auth
          key: client-secret
    - name: MM_GOOGLESETTINGS_DISCOVERYENDPOINT
      value: "https://accounts.google.com/.well-known/openid-configuration"
    - name: MM_GOOGLESETTINGS_SCOPE
      value: "openid email profile"
    - name: MM_GOOGLESETTINGS_BUTTONTEXT
      value: {{ required "mattermost_google_button_text is required" .Values.mattermost_google_button_text | quote }}
    - name: MM_GOOGLESETTINGS_ALLOWEDHOSTEDDOMAINS
      value: {{ .Values.mattermost_google_hosted_domains | quote }}
    - name: MM_GOOGLESETTINGS_ALLOWEDDOMAINS
      value: {{ .Values.mattermost_google_email_domains | quote }}
    - name: MM_TEAMSETTINGS_RESTRICTCREATIONTODOMAINS
      value: {{ .Values.mattermost_google_email_domains | quote }}
    {{- if .Values.mattermost_smtp_enabled }}
    # Workspace SMTP Relay authenticates this workload by the platform's
    # reserved Cloud NAT IP. Do not add a Google password or enable SMTP AUTH.
    - name: MM_SERVICESETTINGS_ENABLEEMAILINVITATIONS
      value: "true"
    - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
      value: "true"
    - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
      value: "false"
    - name: MM_EMAILSETTINGS_SMTPSERVER
      value: {{ required "mattermost_smtp_server is required when SMTP is enabled" .Values.mattermost_smtp_server | quote }}
    - name: MM_EMAILSETTINGS_SMTPPORT
      value: {{ required "mattermost_smtp_port is required when SMTP is enabled" .Values.mattermost_smtp_port | quote }}
    - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
      value: {{ required "mattermost_smtp_connection_security is required when SMTP is enabled" .Values.mattermost_smtp_connection_security | quote }}
    - name: MM_EMAILSETTINGS_FEEDBACKNAME
      value: {{ required "mattermost_smtp_feedback_name is required when SMTP is enabled" .Values.mattermost_smtp_feedback_name | quote }}
    - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
      value: {{ required "mattermost_smtp_feedback_email is required when SMTP is enabled" .Values.mattermost_smtp_feedback_email | quote }}
    - name: MM_EMAILSETTINGS_REPLYTOADDRESS
      value: {{ required "mattermost_smtp_reply_to is required when SMTP is enabled" .Values.mattermost_smtp_reply_to | quote }}
    - name: MM_EMAILSETTINGS_SKIPSERVERCERTIFICATEVERIFICATION
      value: "false"
    {{- end }}

  # Keep the existing replica serving until its replacement is Ready. The
  # operator renders RollingUpdate with maxSurge=1 and maxUnavailable=0, so a
  # release temporarily schedules two pods and never tears the old one down
  # first.
  deploymentTemplate:
    deploymentStrategyType: RollingUpdate

  # Mattermost synchronizes and activates prepackaged plugins before opening
  # port 8065. That regularly takes 30-45 seconds on the small general-pool
  # node. The operator default starts liveness checks after 10 seconds, which
  # can trap a healthy-but-still-starting process in CrashLoopBackOff. Keep
  # readiness strict for traffic routing, but do not let liveness kill the pod
  # during its bounded startup window.
  probes:
    livenessProbe:
      httpGet:
        path: /api/v4/system/ping
        port: 8065
        scheme: HTTP
      initialDelaySeconds: 120
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /api/v4/system/ping
        port: 8065
        scheme: HTTP
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 24

  ingress:
    enabled: true
    host: "yourown.chat"
    ingressClass: nginx
    tlsSecret: mattermost-origin-tls
    annotations:
      # AOP mTLS toggle. verify-client "on" requires the cloudflare-origin-pull-ca
      # Secret; "off" = Full (Strict) TLS only. The auth-tls-secret is loaded by
      # nginx regardless of verify-client, so the CA Secret must always exist.
      nginx.ingress.kubernetes.io/auth-tls-verify-client: {{ required "Cloud Deploy parameter aop_verify_client is required" .Values.aop_verify_client | quote }}
      nginx.ingress.kubernetes.io/auth-tls-secret: "mattermost/cloudflare-origin-pull-ca"
      nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

  database:
    external:
      secret: mattermost-db

  fileStore:
    external:
      url: storage.googleapis.com
      bucket: {{ required "Cloud Deploy parameter filestore_bucket is required" .Values.filestore_bucket | quote }}
      secret: mattermost-filestore

  scheduling:
    resources:
      requests:
        # Kubernetes CPU quantities have 1m precision, so half of 25m is
        # rounded up rather than below the requested 50% target.
        cpu: 13m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
{{- end }}
