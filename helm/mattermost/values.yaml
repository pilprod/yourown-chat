environment: dev
priorityClassName: development

# Cloud Deploy supplies these as Helm --set values. Environment-specific
# templates require only the parameters they consume.
mattermost_dev_image: ""
mattermost_version: ""
mattermost_dev_gsa: ""
mattermost_gsa: ""
mattermost_cloudsql_ip: ""
filestore_bucket: ""
aop_verify_client: ""

# Production authentication defaults. Google OAuth remains disabled until the
# real Secret Manager versions are installed and the Workspace OAuth client is
# ready. Native Mattermost TOTP is enabled but initially not enforced so
# existing email users can enroll without being locked out.
mattermost_mfa_enabled: false
mattermost_mfa_enforced: false
mattermost_google_auth_enabled: false
mattermost_google_button_text: "Google Workspace"
mattermost_google_hosted_domains: ""
mattermost_google_email_domains: ""

# Site identity and display policy. Supplying these settings as environment
# variables keeps them consistent across dev/prod and prevents System Console
# changes from drifting away from the declared configuration.
mattermost_guest_access_enabled: true
mattermost_site_name: "YourOwn.Chat"
mattermost_teammate_name_display: "full_name"
mattermost_lock_teammate_name_display: true

# Mattermost Calls. Kubernetes production uses the supported standalone RTCD
# topology. The source image is pinned to the v1.2.6 multi-arch OCI index; the
# platform release mirrors its selected architecture into our Artifact Registry
# and overrides this value with the resulting repository@digest reference.
mattermost_calls_enabled: true
mattermost_calls_default_enabled: true
mattermost_calls_allow_screen_sharing: true
mattermost_calls_max_participants: 10
# Safe rendering fallback. The release pipeline always replaces this with the
# immutable Artifact Registry digest of our audited RTCD security rebuild.
mattermost_rtcd_image: "mattermost/rtcd@sha256:a8c3c1c3fa2937527d3a96351534fa116106b88aca777bed49d6a360fb2eacd3"
mattermost_calls_ip: ""

# Google Workspace SMTP Relay. Production/dev overlays opt in with distinct
# From addresses. Relay authentication is the Terraform-managed static Cloud
# NAT IP, so no SMTP user password is stored in Kubernetes or Terraform.
mattermost_smtp_enabled: false
mattermost_smtp_server: "smtp-relay.gmail.com"
mattermost_smtp_port: "587"
mattermost_smtp_connection_security: "STARTTLS"
mattermost_smtp_feedback_name: "YourOwn.Chat"
mattermost_smtp_feedback_email: ""
mattermost_smtp_reply_to: ""
