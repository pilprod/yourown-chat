environment: dev
priorityClassName: development

# Cloud Deploy supplies these as Helm --set values. Environment-specific
# templates require only the parameters they consume.
mattermost_dev_image: ""
mattermost_version: ""
mattermost_dev_gsa: ""
mattermost_gsa: ""
mattermost_cloudsql_ip: ""
filestore_bucket: ""
aop_verify_client: ""

# Production authentication defaults. Google OAuth remains disabled until the
# real Secret Manager versions are installed and the Workspace OAuth client is
# ready. Native Mattermost TOTP is enabled but initially not enforced so
# existing email users can enroll without being locked out.
mattermost_mfa_enabled: false
mattermost_mfa_enforced: false
mattermost_google_auth_enabled: false
mattermost_google_button_text: "Google Workspace"
mattermost_google_hosted_domains: ""
mattermost_google_email_domains: ""

# Google Workspace SMTP Relay. Production/dev overlays opt in with distinct
# From addresses. Relay authentication is the Terraform-managed static Cloud
# NAT IP, so no SMTP user password is stored in Kubernetes or Terraform.
mattermost_smtp_enabled: false
mattermost_smtp_server: "smtp-relay.gmail.com"
mattermost_smtp_port: "587"
mattermost_smtp_connection_security: "STARTTLS"
mattermost_smtp_feedback_name: "Mattermost"
mattermost_smtp_feedback_email: ""
mattermost_smtp_reply_to: ""
