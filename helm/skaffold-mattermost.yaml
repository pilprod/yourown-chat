# Mattermost-only Cloud Deploy render configuration. Keeping this separate from
# MCP means a change to either component's profiles, verification, or cleanup
# actions cannot route a release for the other component.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: yourown-chat-mattermost

deploy:
  kubectl: {}

profiles:
  # Ephemeral migration/smoke environment. Persistent PostgreSQL is owned by
  # Terraform's dev-postgres resources and is intentionally absent here.
  - name: mattermost-dev
    manifests:
      helm:
        releases:
          - name: mattermost-dev
            chartPath: mattermost
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mattermost/values.yaml
              - mattermost/values-dev.yaml
    verify:
      - name: smoke-test
        container:
          name: smoke-test
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              check() {
                label="$1"
                url="$2"
                echo "[calls-verify] checking ${label}: ${url}"
                curl -sSf --retry 30 --retry-connrefused --retry-delay 5 "${url}"
                echo
              }
              check "Mattermost API" "http://dev-mattermost.dev.svc.cluster.local:8065/api/v4/system/ping"
              check "Calls plugin" "http://dev-mattermost.dev.svc.cluster.local:8065/plugins/com.mattermost.calls/version"
              check "RTCD private API" "http://dev-rtcd.dev.svc.cluster.local:8045/version"
        executionMode:
          kubernetesCluster:
            jobManifestPath: mattermost/verify/job.yaml

  # Optional bridge is additive only to the Mattermost dev stage.
  - name: matterbridge
    manifests:
      rawYaml:
        - matterbridge/serviceaccount.yaml
        - matterbridge/secretproviderclass.yaml
        - matterbridge/networkpolicy.yaml
        - matterbridge/deployment.yaml

  - name: mattermost-prod
    manifests:
      helm:
        releases:
          - name: mattermost-prod
            chartPath: mattermost
            namespace: mattermost
            createNamespace: false
            valuesFiles:
              - mattermost/values.yaml
              - mattermost/values-prod.yaml
    verify:
      - name: prod-calls-smoke
        container:
          name: smoke-test
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              check() {
                label="$1"
                url="$2"
                echo "[calls-verify] checking ${label}: ${url}"
                curl -sSf --retry 30 --retry-connrefused --retry-delay 5 "${url}"
                echo
              }
              check "Mattermost API" "https://yourown.chat/api/v4/system/ping"
              # Check the application before the Cloudflare-facing route. This
              # distinguishes a plugin activation failure from edge routing.
              check "Calls plugin (cluster origin)" "http://mattermost.mattermost.svc.cluster.local:8065/plugins/com.mattermost.calls/version"
              check "Calls plugin (public edge)" "https://yourown.chat/plugins/com.mattermost.calls/version"
              check "RTCD private API" "http://mattermost-rtcd.mattermost-rtcd.svc.cluster.local:8045/version"
        executionMode:
          kubernetesCluster:
            jobManifestPath: mattermost/verify/prod-job.yaml

# Cloud Deploy executes this PREDEPLOY action in Cloud Build under the
# dedicated cleanup service account, not as a pod in GKE.
customActions:
  - name: cleanup-mattermost-dev
    containers:
      - name: cleanup-mattermost-dev
        image: gcr.io/cloud-builders/kubectl@sha256:3744bfd3765ac2a09133a164fcd74c8468fac192af8accadbdfbccbb20643961
        command: ["/bin/sh", "-ceu"]
        args:
          - |
            cluster_name="${GKE_CLUSTER##*/}"
            cluster_parent="${GKE_CLUSTER%/clusters/*}"
            cluster_location="${cluster_parent##*/}"
            cluster_project_path="${cluster_parent%/locations/*}"
            cluster_project="${cluster_project_path##*/}"
            gcloud container clusters get-credentials "${cluster_name}" \
              --project "${cluster_project}" \
              --location "${cluster_location}"
            for dev_deployment in dev-mattermost dev-rtcd; do
              if kubectl --namespace dev get "deployment/${dev_deployment}" >/dev/null 2>&1; then
                kubectl --namespace dev scale "deployment/${dev_deployment}" --replicas=0
              fi
            done
