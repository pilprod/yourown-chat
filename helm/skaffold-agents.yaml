apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: yourown-chat-agents

deploy:
  kubectl: {}

profiles:
  - name: agents-paused
    manifests:
      helm:
        releases:
          - name: agent-platform
            chartPath: agent-platform
            namespace: yourown-agents
            createNamespace: false
            valuesFiles: [agent-platform/values.yaml]
    verify:
      - name: agent-platform-smoke
        container:
          name: verify
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              for name in agent-platform-workflow-worker agent-platform-activity-worker; do
                deployment="$(curl --fail --silent --show-error --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Authorization: Bearer ${token}" "https://kubernetes.default.svc/apis/apps/v1/namespaces/yourown-agents/deployments/${name}")"
                replicas="$(printf '%s' "${deployment}" | sed -n 's/.*"replicas":\([0-9][0-9]*\).*/\1/p' | head -n1)"
                [ "${replicas}" = "0" ] || { echo "Expected ${name} to be paused, found ${replicas}"; exit 1; }
              done
              echo 'Agent workers are paused at zero replicas'
        executionMode:
          kubernetesCluster:
            jobManifestPath: agent-platform/verify/job.yaml

  - name: agents-running
    manifests:
      helm:
        releases:
          - name: agent-platform
            chartPath: agent-platform
            namespace: yourown-agents
            createNamespace: false
            valuesFiles: [agent-platform/values.yaml, agent-platform/values-running.yaml]
    verify:
      - name: agent-platform-smoke
        container:
          name: verify
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              for name in agent-platform-workflow-worker agent-platform-activity-worker; do
                ready=""
                for attempt in $(seq 1 30); do
                  deployment="$(curl --fail --silent --show-error --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Authorization: Bearer ${token}" "https://kubernetes.default.svc/apis/apps/v1/namespaces/yourown-agents/deployments/${name}")"
                  ready="$(printf '%s' "${deployment}" | sed -n 's/.*"availableReplicas":\([0-9][0-9]*\).*/\1/p' | head -n1)"
                  [ "${ready}" = "1" ] && break
                  sleep 5
                done
                [ "${ready}" = "1" ] || { echo "${name} did not become available"; exit 1; }
              done
        executionMode:
          kubernetesCluster:
            jobManifestPath: agent-platform/verify/job.yaml
