# Без оверлея running вычисления стоят в нуле. Серверный контур и данные
# Temporal имеют отдельный жизненный цикл.
yourown_chat_workflow_worker_image: ""
yourown_chat_activity_worker_image: ""
agent_workflow_worker_gsa: ""
agent_activity_worker_gsa: ""
agent_results_bucket: ""
agent_runtime_enabled: false

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: yourown-chat
  workflowTaskQueue: agent-orchestration-go-v1
  activityTaskQueue: agent-activities-go-v1

workflowWorker:
  replicaCount: 1
  metricsPort: 9464
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

activityWorker:
  replicaCount: 1
  metricsPort: 9464
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

priorityClassName: development
serviceAccounts:
  workflowWorker: agent-workflow-worker
  activityWorker: agent-activity-worker

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

networkPolicy:
  enabled: true
  activityNamespaces: [mattermost, mcp-google-cloud, mcp-terraform-stacks]
