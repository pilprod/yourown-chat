{{- $temporalEnv := list
  (dict "name" "TEMPORAL_ADDRESS" "value" .Values.temporal.address)
  (dict "name" "TEMPORAL_NAMESPACE" "value" .Values.temporal.namespace)
  (dict "name" "TEMPORAL_WORKFLOW_TASK_QUEUE" "value" .Values.temporal.workflowTaskQueue)
  (dict "name" "TEMPORAL_ACTIVITY_TASK_QUEUE" "value" .Values.temporal.activityTaskQueue)
-}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yourown-chat-control-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: yourown-chat-control-api
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.agent_runtime_enabled }}{{ .Values.api.replicaCount }}{{ else }}0{{ end }}
  selector:
    matchLabels: { app: yourown-chat-control-api }
  template:
    metadata:
      labels:
        app: yourown-chat-control-api
        {{- include "agent-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.controlApi }}
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-api
          image: {{ required "yourown_chat_control_api_image is required" .Values.yourown_chat_control_api_image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            {{- toYaml $temporalEnv | nindent 12 }}
            - name: MATTERMOST_URL
              value: {{ .Values.mattermost.url | quote }}
            - name: WORKFLOW_ID_KEY_FILE
              value: /var/run/secrets/agent/workflow-id-key
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: agent-secrets
              mountPath: /var/run/secrets/agent
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: agent-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: backend-control-api-gcp }
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-workflow-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-platform-workflow-worker
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.agent_runtime_enabled }}{{ .Values.workflowWorker.replicaCount }}{{ else }}0{{ end }}
  selector:
    matchLabels: { app: agent-platform-workflow-worker }
  template:
    metadata:
      labels:
        app: agent-platform-workflow-worker
        {{- include "agent-platform.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.workflowWorker.metricsPort | quote }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.workflowWorker }}
      priorityClassName: {{ .Values.priorityClassName }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workflow-worker
          image: {{ required "yourown_chat_workflow_worker_image is required" .Values.yourown_chat_workflow_worker_image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            {{- toYaml $temporalEnv | nindent 12 }}
          ports:
            - { name: metrics, containerPort: {{ .Values.workflowWorker.metricsPort }} }
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.workflowWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-activity-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-platform-activity-worker
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.agent_runtime_enabled }}{{ .Values.activityWorker.replicaCount }}{{ else }}0{{ end }}
  selector:
    matchLabels: { app: agent-platform-activity-worker }
  template:
    metadata:
      labels:
        app: agent-platform-activity-worker
        {{- include "agent-platform.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.activityWorker.metricsPort | quote }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.activityWorker }}
      priorityClassName: {{ .Values.priorityClassName }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: activity-worker
          image: {{ required "yourown_chat_activity_worker_image is required" .Values.yourown_chat_activity_worker_image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            {{- toYaml $temporalEnv | nindent 12 }}
            - name: AGENT_RESULTS_BUCKET
              value: {{ .Values.agent_results_bucket | quote }}
          ports:
            - { name: metrics, containerPort: {{ .Values.activityWorker.metricsPort }} }
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.activityWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
