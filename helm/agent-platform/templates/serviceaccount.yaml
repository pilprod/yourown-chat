apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.controlApi }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: yourown-chat-control-api
    {{- include "agent-platform.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "backend_control_api_gsa is required" .Values.backend_control_api_gsa | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.workflowWorker }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-platform-workflow-worker
    {{- include "agent-platform.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "agent_workflow_worker_gsa is required" .Values.agent_workflow_worker_gsa | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.activityWorker }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-platform-activity-worker
    {{- include "agent-platform.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "agent_activity_worker_gsa is required" .Values.agent_activity_worker_gsa | quote }}
