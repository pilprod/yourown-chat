apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.workflowWorker }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-platform-workflow-worker
    {{- include "agent-platform.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "agent_workflow_worker_gsa is required" .Values.agent_workflow_worker_gsa | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.activityWorker }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-platform-activity-worker
    {{- include "agent-platform.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "agent_activity_worker_gsa is required" .Values.agent_activity_worker_gsa | quote }}
{{- if .Values.agent_rag_enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-rag-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-rag-migrate
    {{- include "agent-platform.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "agent_rag_migrate_gsa is required when agent_rag_enabled is true" .Values.agent_rag_migrate_gsa | quote }}
automountServiceAccountToken: false
{{- end }}
