{{- if .Values.agent_rag_enabled }}
{{- $project := required "agent_secret_project is required when agent_rag_enabled is true" .Values.agent_secret_project }}
# Secret values never enter Helm values or Terraform state: the GKE Secret
# Manager CSI driver mounts them as read-only files. Outside GKE the same
# file names are provided by any secret mechanism.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-rag-activity-gcp
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-platform-activity-worker
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ $project }}/secrets/{{ required "agent_rag_runtime_database_secret_id is required" .Values.agent_rag_runtime_database_secret_id }}/versions/latest"
        path: "database-url"
      - resourceName: "projects/{{ $project }}/secrets/{{ required "rag.mattermostTokenSecretId is required" .Values.rag.mattermostTokenSecretId }}/versions/latest"
        path: "mattermost-token"
      {{- with .Values.rag.embeddings.tokenSecretId }}
      - resourceName: "projects/{{ $project }}/secrets/{{ . }}/versions/latest"
        path: "embeddings-token"
      {{- end }}
      {{- with .Values.rag.generation.tokenSecretId }}
      - resourceName: "projects/{{ $project }}/secrets/{{ . }}/versions/latest"
        path: "model-api-token"
      {{- end }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-rag-migrate-gcp
  namespace: {{ .Release.Namespace }}
  labels:
    app: agent-rag-migrate
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ $project }}/secrets/{{ required "agent_rag_database_secret_id is required" .Values.agent_rag_database_secret_id }}/versions/latest"
        path: "database-url"
{{- end }}
