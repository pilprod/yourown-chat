# Service release manifest (test fixture for a service repository).
# Lists the service-owned platform-profile release wrappers and the typed
# release-parameter bindings of their workloads. It contains no pipeline,
# Skaffold or Kubernetes content; the platform release assembler consumes it.
apiVersion: platform.yourown.chat/v1
kind: ReleaseManifest
wrappers:
  - name: identity
    path: helm/identity
    namespace: identity
    workloads:
      identity-api:
        image: yourown-chat-identity-api
      identity-migrate:
        image: yourown-chat-identity-migrate
        identity: identity-migrate
