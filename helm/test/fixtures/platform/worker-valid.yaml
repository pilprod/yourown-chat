# Neutral asynchronous worker used to exercise the reusable profile.
workload:
  name: queue-worker
  partOf: worker-profile-test
image:
  digest: europe-west3-docker.pkg.dev/example-project/docker/worker-fixture@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
container:
  env:
    QUEUE_ADDRESS: queue.queue-system.svc.cluster.local:7233
    QUEUE_NAME: work-items-v1
    RESULTS_BUCKET: example-results
  ports:
    - name: metrics
      port: 9464
  health:
    port: metrics
    startup:
      httpGet: { path: /healthz }
    readiness:
      httpGet: { path: /readyz }
    liveness:
      httpGet: { path: /healthz }
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
runtime:
  replicas: 1
  paused: true
  priorityClass: development
identity:
  googleServiceAccount: queue-worker@example-project.iam.gserviceaccount.com
network:
  clusterDNSIP: 10.30.0.10
  ingress:
    - name: metrics-scrape
      purpose: In-namespace Prometheus scrape of the worker metrics endpoint
      from: { sameNamespace: true }
      ports: [{ port: 9464 }]
  egress:
    - name: queue
      purpose: Queue polling for generic worker tasks
      to: { namespace: queue-system }
      ports: [{ port: 7233 }]
    - name: tool-api
      purpose: Approved tool calls from the worker
      to: { namespace: tool-api, podLabels: { app: tool-api } }
      ports: [{ port: 8080 }]
    - name: workload-identity
      purpose: Workload Identity token exchange for object storage access
      to: { metadataServer: true }
      ports: [{ port: 80 }]
observability:
  metrics:
    enabled: true
    port: metrics
