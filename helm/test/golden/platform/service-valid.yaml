apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: identity
  labels:
    app: identity-api
    app.kubernetes.io/name: identity-api
    app.kubernetes.io/instance: test-service-valid
    app.kubernetes.io/component: platform-service
    app.kubernetes.io/part-of: yourown-chat-server
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-service-0.1.0"
    platform.yourown.chat/profile: platform-service
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/paused: "false"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: identity-api
      app.kubernetes.io/name: identity-api
      app.kubernetes.io/instance: test-service-valid
  template:
    metadata:
      labels:
        app: identity-api
        app.kubernetes.io/name: identity-api
        app.kubernetes.io/instance: test-service-valid
        app.kubernetes.io/component: platform-service
        app.kubernetes.io/part-of: yourown-chat-server
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: "platform-service-0.1.0"
        platform.yourown.chat/profile: platform-service
        platform.yourown.chat/chart-version: "0.1.0"
      annotations:
        platform.yourown.chat/image-digest: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        checksum/secrets: "9e9e237a62edcedd92fda1c709dcbc0d1a31d1aee6bf1c3e7a354fc5926085ef"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: identity-api
      priorityClassName: production
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-api
          image: "europe-west3-docker.pkg.dev/example-project/docker/yourown-chat-identity-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          imagePullPolicy: IfNotPresent
          env:
            - name: IDENTITY_API_PORT
              value: "8081"
            - name: IDENTITY_DATABASE_URL_FILE
              value: "/var/run/secrets/app/database-url"
            - name: IDENTITY_SESSION_TTL
              value: "720h"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: platform-secrets
              mountPath: /var/run/secrets/app
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: platform-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: identity-api-secrets

