# Source: platform-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-api
  namespace: identity
  labels:
    app: identity-api
    app.kubernetes.io/name: identity-api
    app.kubernetes.io/instance: test-service-valid
    app.kubernetes.io/component: platform-service
    app.kubernetes.io/part-of: yourown-chat-server
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-service-0.1.0"
    platform.yourown.chat/profile: platform-service
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/ingress-rules: "from-transport,metrics-scrape"
    platform.yourown.chat/egress-rules: "cloudsql,mattermost"
spec:
  podSelector:
    matchLabels:
      app: identity-api
      app.kubernetes.io/name: identity-api
      app.kubernetes.io/instance: test-service-valid
  policyTypes: [Ingress, Egress]
  ingress:
    # from-transport: Transport gateway forwards authenticated identity requests
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "edge"
          podSelector:
            matchLabels:
              app: transport
      ports:
        - protocol: TCP
          port: 8081
    # metrics-scrape: In-namespace Prometheus scrape of the metrics endpoint
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9464
  egress:
    # platform-dns: cluster DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: "10.30.0.10/32"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # cloudsql: PostgreSQL on the private Cloud SQL address
    - to:
        - ipBlock:
            cidr: "10.20.30.40/32"
      ports:
        - protocol: TCP
          port: 5432
    # mattermost: Workspace link verification against the private Mattermost Service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "mattermost"
      ports:
        - protocol: TCP
          port: 8065

