---
# Source: platform-job/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nightly-maintenance
  namespace: identity
  labels:
    app: nightly-maintenance
    app.kubernetes.io/name: nightly-maintenance
    app.kubernetes.io/instance: test-job-cron-valid
    app.kubernetes.io/component: platform-job
    app.kubernetes.io/part-of: nightly-maintenance
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-job-0.1.0"
    platform.yourown.chat/profile: platform-job
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/ingress-rules: ""
    platform.yourown.chat/egress-rules: "cloudsql"
spec:
  podSelector:
    matchLabels:
      app: nightly-maintenance
      app.kubernetes.io/name: nightly-maintenance
      app.kubernetes.io/instance: test-job-cron-valid
  policyTypes: [Ingress, Egress]
  # No ingress rule is declared: the workload accepts no inbound traffic.
  ingress: []
  egress:
    # platform-dns: cluster DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # cloudsql: Retention pruning against the private Cloud SQL address
    - to:
        - ipBlock:
            cidr: "10.20.30.40/32"
      ports:
        - protocol: TCP
          port: 5432

