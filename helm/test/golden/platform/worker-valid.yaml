---
# Source: platform-worker/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: activity-worker
  namespace: yourown-agents
  labels:
    app: activity-worker
    app.kubernetes.io/name: activity-worker
    app.kubernetes.io/instance: test-worker-valid
    app.kubernetes.io/component: platform-worker
    app.kubernetes.io/part-of: yourown-chat-agents
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-worker-0.1.0"
    platform.yourown.chat/profile: platform-worker
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/ingress-rules: "metrics-scrape"
    platform.yourown.chat/egress-rules: "temporal,mcp-google-cloud,workload-identity"
spec:
  podSelector:
    matchLabels:
      app: activity-worker
      app.kubernetes.io/name: activity-worker
      app.kubernetes.io/instance: test-worker-valid
  policyTypes: [Ingress, Egress]
  ingress:
    # metrics-scrape: In-namespace Prometheus scrape of the worker metrics endpoint
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9464
  egress:
    # platform-dns: cluster DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: "10.30.0.10/32"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # temporal: Temporal frontend gRPC for activity polling
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "temporal"
      ports:
        - protocol: TCP
          port: 7233
    # mcp-google-cloud: Approved MCP tool calls from activities
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "mcp-google-cloud"
          podSelector:
            matchLabels:
              app: mcp-google-cloud
      ports:
        - protocol: TCP
          port: 8080
    # workload-identity: Workload Identity token exchange for Cloud Storage access
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80

