---
# Source: platform-worker/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queue-worker
  namespace: worker-test
  labels:
    app: queue-worker
    app.kubernetes.io/name: queue-worker
    app.kubernetes.io/instance: test-worker-valid
    app.kubernetes.io/component: platform-worker
    app.kubernetes.io/part-of: worker-profile-test
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-worker-0.1.0"
    platform.yourown.chat/profile: platform-worker
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/ingress-rules: "metrics-scrape"
    platform.yourown.chat/egress-rules: "queue,tool-api,workload-identity"
spec:
  podSelector:
    matchLabels:
      app: queue-worker
      app.kubernetes.io/name: queue-worker
      app.kubernetes.io/instance: test-worker-valid
  policyTypes: [Ingress, Egress]
  ingress:
    # metrics-scrape: In-namespace Prometheus scrape of the worker metrics endpoint
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9464
  egress:
    # platform-dns: cluster DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: "10.30.0.10/32"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # queue: Queue polling for generic worker tasks
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "queue-system"
      ports:
        - protocol: TCP
          port: 7233
    # tool-api: Approved tool calls from the worker
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "tool-api"
          podSelector:
            matchLabels:
              app: tool-api
      ports:
        - protocol: TCP
          port: 8080
    # workload-identity: Workload Identity token exchange for object storage access
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80

