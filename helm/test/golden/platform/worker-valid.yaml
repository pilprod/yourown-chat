---
# Source: platform-worker/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: worker-test
  labels:
    app: queue-worker
    app.kubernetes.io/name: queue-worker
    app.kubernetes.io/instance: test-worker-valid
    app.kubernetes.io/component: platform-worker
    app.kubernetes.io/part-of: worker-profile-test
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-worker-0.1.0"
    platform.yourown.chat/profile: platform-worker
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/paused: "true"
spec:
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: queue-worker
      app.kubernetes.io/name: queue-worker
      app.kubernetes.io/instance: test-worker-valid
  template:
    metadata:
      labels:
        app: queue-worker
        app.kubernetes.io/name: queue-worker
        app.kubernetes.io/instance: test-worker-valid
        app.kubernetes.io/component: platform-worker
        app.kubernetes.io/part-of: worker-profile-test
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: "platform-worker-0.1.0"
        platform.yourown.chat/profile: platform-worker
        platform.yourown.chat/chart-version: "0.1.0"
      annotations:
        platform.yourown.chat/image-digest: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: queue-worker
      priorityClassName: development
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: queue-worker
          image: "europe-west3-docker.pkg.dev/example-project/docker/worker-fixture@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
          imagePullPolicy: IfNotPresent
          env:
            - name: QUEUE_ADDRESS
              value: "queue.queue-system.svc.cluster.local:7233"
            - name: QUEUE_NAME
              value: "work-items-v1"
            - name: RESULTS_BUCKET
              value: "example-results"
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
