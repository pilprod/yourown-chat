# Source: platform-stateful/templates/services.yaml
# Dedicated layer-four exposure for TCP transport only. Separate
# per-protocol Services share one reserved address and select only this
# workload; no control, administrative or unrelated port is published.
apiVersion: v1
kind: Service
metadata:
  name: rtcd-tcp
  namespace: mattermost-rtcd
  labels:
    app: rtcd
    app.kubernetes.io/name: rtcd
    app.kubernetes.io/instance: test-stateful-valid
    app.kubernetes.io/component: platform-stateful
    app.kubernetes.io/part-of: yourown-chat-mattermost
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-stateful-0.1.0"
    platform.yourown.chat/profile: platform-stateful
    platform.yourown.chat/chart-version: "0.1.0"
    platform.yourown.chat/exposure: layer4
  annotations:
    cloud.google.com/l4-rbs: "enabled"
spec:
  type: LoadBalancer
  loadBalancerIP: "203.0.113.10"
  externalTrafficPolicy: Local
  selector:
    app: rtcd
    app.kubernetes.io/name: rtcd
    app.kubernetes.io/instance: test-stateful-valid
  ports:
    - name: rtc-tcp
      port: 8443
      targetPort: rtc-tcp
      protocol: TCP
