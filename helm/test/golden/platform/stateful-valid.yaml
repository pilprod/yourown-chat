---
# Source: platform-stateful/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rtcd
  namespace: mattermost-rtcd
  labels:
    app: rtcd
    app.kubernetes.io/name: rtcd
    app.kubernetes.io/instance: test-stateful-valid
    app.kubernetes.io/component: platform-stateful
    app.kubernetes.io/part-of: yourown-chat-mattermost
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-stateful-0.1.0"
    platform.yourown.chat/profile: platform-stateful
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/paused: "false"
spec:
  serviceName: rtcd-headless
  replicas: 1
  revisionHistoryLimit: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: rtcd
      app.kubernetes.io/name: rtcd
      app.kubernetes.io/instance: test-stateful-valid
  template:
    metadata:
      labels:
        app: rtcd
        app.kubernetes.io/name: rtcd
        app.kubernetes.io/instance: test-stateful-valid
        app.kubernetes.io/component: platform-stateful
        app.kubernetes.io/part-of: yourown-chat-mattermost
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: "platform-stateful-0.1.0"
        platform.yourown.chat/profile: platform-stateful
        platform.yourown.chat/chart-version: "0.1.0"
      annotations:
        platform.yourown.chat/image-digest: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: rtcd
      priorityClassName: production
      terminationGracePeriodSeconds: 300
      nodeSelector:
        pool: "general"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rtcd
          image: "europe-west3-docker.pkg.dev/example-project/docker/rtcd@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
          imagePullPolicy: IfNotPresent
          env:
            - name: RTCD_API_SECURITY_ALLOWSELFREGISTRATION
              value: "true"
            - name: RTCD_LOGGER_CONSOLEJSON
              value: "true"
            - name: RTCD_RTC_ICEHOSTOVERRIDE
              value: "203.0.113.10"
            - name: RTCD_RTC_ICEPORTTCP
              value: "8443"
            - name: RTCD_RTC_ICEPORTUDP
              value: "8443"
            - name: RTCD_STORE_DATASOURCE
              value: "/var/lib/rtcd/rtcd_db"
          ports:
            - name: api
              containerPort: 8045
              protocol: TCP
            - name: rtc-tcp
              containerPort: 8443
              protocol: TCP
            - name: rtc-udp
              containerPort: 8443
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /version
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /version
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/rtcd
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: rtcd
          app.kubernetes.io/name: rtcd
          app.kubernetes.io/instance: test-stateful-valid
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "rtcd-cmek"
        resources:
          requests:
            storage: 1Gi
