# Source: platform-job/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-migrate
  namespace: identity
  labels:
    app: identity-migrate
    app.kubernetes.io/name: identity-migrate
    app.kubernetes.io/instance: test-job-valid
    app.kubernetes.io/component: platform-job
    app.kubernetes.io/part-of: yourown-chat-server
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "platform-job-0.1.0"
    platform.yourown.chat/profile: platform-job
    platform.yourown.chat/chart-version: "0.1.0"
  annotations:
    platform.yourown.chat/ingress-rules: ""
    platform.yourown.chat/egress-rules: "cloudsql"
spec:
  podSelector:
    matchLabels:
      app: identity-migrate
      app.kubernetes.io/name: identity-migrate
      app.kubernetes.io/instance: test-job-valid
  policyTypes: [Ingress, Egress]
  # No ingress rule is declared: the workload accepts no inbound traffic.
  ingress: []
  egress:
    # platform-dns: cluster DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: "10.30.0.10/32"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # cloudsql: PostgreSQL migrations on the private Cloud SQL address
    - to:
        - ipBlock:
            cidr: "10.20.30.40/32"
      ports:
        - protocol: TCP
          port: 5432

