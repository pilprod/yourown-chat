# MANUAL FALLBACK for cutting a Cloud Deploy release of the helm/ workloads.
# The stack's deploy_release component runs the same `gcloud deploy releases
# create` automatically on semver tags; this file documents that command for a
# manual run from any checkout. The MCP fallback resolves the newest immutable
# application release tag and passes its digests to Cloud Deploy; private MCP
# source is never copied into or rebuilt by this public repository.

substitutions:
  _REGION: europe-west3
  _AR_LOCATION: europe-west3
  _AR_REPOSITORY: docker
  # Choose `mattermost` or `mcp`. This fallback creates exactly one release.
  _PIPELINE: mattermost
  # The Terraform-managed releaser can target both component pipelines.
  _RELEASE_SA_EMAIL: releaser-europe-west3@${PROJECT_ID}.iam.gserviceaccount.com

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_RELEASE_SA_EMAIL}

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  - id: release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        release_args=(
          deploy releases create "rel-${SHORT_SHA}-${BUILD_ID}"
          --project="${PROJECT_ID}"
          --region="${_REGION}"
          --delivery-pipeline="${_PIPELINE}"
          --source=helm
        )

        if [ "${_PIPELINE}" = "mcp" ]; then
          ar_prefix="${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}"
          deploy_parameters=""
          for server in google-cloud terraform-stacks; do
            repository="$${ar_prefix}/mcp-$${server}"
            release_tag="$$(gcloud artifacts docker tags list "$${repository}" \
              --filter="tag~'/tags/[0-9]+\\.[0-9]+\\.[0-9]+$$'" \
              --format='value(tag)' | sort -V | tail -n1)"
            [ -n "$${release_tag}" ] || { echo "No released MCP tag for $${server}" >&2; exit 1; }
            release_tag="$${release_tag##*/}"
            digest="$$(gcloud artifacts docker images describe \
              "$${repository}:$${release_tag}" --format='value(image_summary.digest)')"
            parameter="mcp_$$(printf '%s' "$${server}" | tr '-' '_')_image"
            [ -z "$${deploy_parameters}" ] || deploy_parameters="$${deploy_parameters},"
            deploy_parameters="$${deploy_parameters}$${parameter}=$${repository}@$${digest}"
          done
          tunnel_repository="$${ar_prefix}/mcp-cloudflared"
          tunnel_digest="$$(gcloud artifacts docker images describe \
            "$${tunnel_repository}:runtime" --format='value(image_summary.digest)')"
          deploy_parameters="$${deploy_parameters},mcp_tunnel_image=$${tunnel_repository}@$${tunnel_digest}"
          release_args+=(
            --deploy-parameters
            "$${deploy_parameters}"
          )
        fi

        gcloud "$${release_args[@]}"
