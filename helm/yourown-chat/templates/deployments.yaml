apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport
  namespace: {{ .Values.namespaces.edge }}
  labels:
    app: transport
    {{- include "yourown-chat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.transport.replicaCount }}
  selector:
    matchLabels: { app: transport }
  template:
    metadata:
      labels:
        app: transport
        {{- include "yourown-chat.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccounts.transportApi }}
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: transport-api
          image: {{ required "yourown_chat_transport_api_image is required" .Values.yourown_chat_transport_api_image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: TRANSPORT_API_PORT, value: {{ .Values.transport.port | quote }} }
            - { name: TRANSPORT_KEY_ID, value: {{ required "transport.keyID is required" .Values.transport.keyID | quote }} }
            - { name: TRANSPORT_PRIVATE_KEY_FILE, value: /var/run/secrets/transport/private-key }
            - { name: IDENTITY_DATABASE_URL_FILE, value: /var/run/secrets/transport/database-url }
            - { name: TRANSPORT_AUTH_UPSTREAM, value: http://auth.{{ .Values.namespaces.edge }}.svc.cluster.local:8083 }
            - { name: TRANSPORT_IDENTITY_UPSTREAM, value: http://api.{{ .Values.namespaces.identity }}.svc.cluster.local:8081 }
            - { name: TRANSPORT_CONTROL_UPSTREAM, value: http://control.{{ .Values.namespaces.control }}.svc.cluster.local:8080 }
          ports:
            - { name: http, containerPort: {{ .Values.transport.port }} }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.transport.resources | nindent 12 }}
          volumeMounts:
            - { name: transport-secrets, mountPath: /var/run/secrets/transport, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: transport-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: transport-gcp }
        - { name: tmp, emptyDir: {} }
---
