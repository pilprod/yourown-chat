          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.identityAdmin.resources | nindent 12 }}
          volumeMounts:
            - { name: identity-secrets, mountPath: /var/run/secrets/identity, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: identity-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: yourown-chat-identity-admin-gcp }
        - { name: tmp, emptyDir: {} }
{{- if .Values.yourown_chat_control_api_enabled }}
