            - { name: IDENTITY_BOOTSTRAP_WORKSPACE_MATTERMOST_URL, value: {{ required "workspaceBootstrap.mattermostURL is required" .Values.workspaceBootstrap.mattermostURL | quote }} }
            - { name: IDENTITY_BOOTSTRAP_WORKSPACE_TEAM_ID, value: {{ .Values.workspaceBootstrap.teamID | quote }} }
