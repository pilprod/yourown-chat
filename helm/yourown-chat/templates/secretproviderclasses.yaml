apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: transport-gcp
  namespace: {{ .Values.namespaces.edge }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "server_secret_project is required" .Values.server_secret_project }}/secrets/{{ required "identity_runtime_database_connection_secret_id is required" .Values.identity_runtime_database_connection_secret_id }}/versions/latest"
        path: "database-url"
      - resourceName: "projects/{{ .Values.server_secret_project }}/secrets/{{ required "transport_private_key_secret_id is required" .Values.transport_private_key_secret_id }}/versions/latest"
        path: "private-key"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: passkey-gcp
  namespace: {{ .Values.namespaces.edge }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.server_secret_project }}/secrets/{{ required "passkey_record_key_secret_id is required" .Values.passkey_record_key_secret_id }}/versions/latest"
        path: "passkey-record-key"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: auth-gcp
  namespace: {{ .Values.namespaces.edge }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "server_secret_project is required" .Values.server_secret_project }}/secrets/{{ required "identity_runtime_database_connection_secret_id is required" .Values.identity_runtime_database_connection_secret_id }}/versions/latest"
        path: "database-url"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-gcp
  namespace: {{ .Values.namespaces.identity }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "server_secret_project is required" .Values.server_secret_project }}/secrets/{{ required "identity_runtime_database_connection_secret_id is required" .Values.identity_runtime_database_connection_secret_id }}/versions/latest"
        path: "database-url"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: admin-gcp
  namespace: {{ .Values.namespaces.identity }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "server_secret_project is required" .Values.server_secret_project }}/secrets/{{ required "identity_runtime_database_connection_secret_id is required" .Values.identity_runtime_database_connection_secret_id }}/versions/latest"
        path: "database-url"
      - resourceName: "projects/{{ .Values.server_secret_project }}/secrets/yourown-chat-identity-admin-token/versions/latest"
        path: "admin-token"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: migrate-gcp
  namespace: {{ .Values.namespaces.identity }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "server_secret_project is required" .Values.server_secret_project }}/secrets/{{ required "identity_migrate_database_connection_secret_id is required" .Values.identity_migrate_database_connection_secret_id }}/versions/latest"
        path: "database-url"
      - resourceName: "projects/{{ .Values.server_secret_project }}/secrets/{{ required "identity_bootstrap_password_secret_id is required" .Values.identity_bootstrap_password_secret_id }}/versions/latest"
        path: "bootstrap-password"
{{- if .Values.yourown_chat_control_api_enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: control-gcp
  namespace: {{ .Values.namespaces.control }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.server_secret_project }}/secrets/backend-control-api-token/versions/latest"
        path: "workflow-id-key"
{{- end }}
