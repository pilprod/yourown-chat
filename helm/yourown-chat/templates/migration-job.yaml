apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Values.yourown_chat_identity_migrate_image | sha256sum | trunc 12 }}
  namespace: {{ .Values.namespaces.identity }}
  labels:
    app: migrate
    {{- include "yourown-chat.labels" . | nindent 4 }}
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrate
        {{- include "yourown-chat.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccounts.identityMigrate }}
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: identity-migrate
          image: {{ required "yourown_chat_identity_migrate_image is required" .Values.yourown_chat_identity_migrate_image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: IDENTITY_DATABASE_URL_FILE, value: /var/run/secrets/identity/database-url }
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: identity-secrets, mountPath: /var/run/secrets/identity, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: identity-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: migrate-gcp }
        - { name: tmp, emptyDir: {} }
