apiVersion: v1
kind: Service
metadata:
  name: yourown-chat-identity-api
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: yourown-chat-identity-api }
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: yourown-chat-identity-admin
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: { app: yourown-chat-identity-admin }
  ports:
    - { name: http, port: 8082, targetPort: http }
{{- if .Values.keycloak_enabled }}
---
# Edge-only alias. The Keycloak Deployment, database, namespace and service are
# all owned by platform-gcp; this release only shares the existing origin TLS.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ingress.keycloakServiceName }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ExternalName
  externalName: keycloak.keycloak.svc.cluster.local
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
{{- end }}
{{- if .Values.yourown_chat_control_api_enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: yourown-chat-control-api
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: yourown-chat-control-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
