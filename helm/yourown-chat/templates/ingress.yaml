{{- if .Values.yourown_chat_ingress_enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transport
  namespace: {{ .Values.namespaces.edge }}
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "18m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.transportLimitConnections | quote }}
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.transportLimitRPS | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.transportLimitBurstMultiplier | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.apiHost | quote }}
        - {{ .Values.ingress.legacyHost | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /transport/v1
            pathType: Exact
            backend:
              service:
                name: transport
                port: { number: 8084 }
          - path: /transport/v1/socket
            pathType: Exact
            backend:
              service:
                name: transport
                port: { number: 8084 }
    # Compatibility route for installed clients. Remove only after the oldest
    # supported build uses api.yourown.chat. The passkey association document
    # stays on the RP ID host even after the transport compatibility ends.
    - host: {{ .Values.ingress.legacyHost | quote }}
      http:
        paths:
          - path: /.well-known/apple-app-site-association
            pathType: Exact
            backend:
              service:
                name: auth
                port: { number: 8083 }
          - path: /transport/v1
            pathType: Exact
            backend:
              service:
                name: transport
                port: { number: 8084 }
          - path: /transport/v1/socket
            pathType: Exact
            backend:
              service:
                name: transport
                port: { number: 8084 }
{{- end }}
