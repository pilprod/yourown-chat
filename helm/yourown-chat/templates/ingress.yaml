{{- if .Values.yourown_chat_ingress_enabled }}
{{- if .Values.keycloak_enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yourown-chat-keycloak
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.authHost is required" .Values.ingress.authHost | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ required "ingress.authHost is required" .Values.ingress.authHost | quote }}
      http:
        paths:
          # The public hostname exposes only protocol and theme resources.
          - path: /(realms|resources)(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.ingress.keycloakServiceName }}
                port: { number: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yourown-chat-keycloak-provider
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.keycloakAdminLimitRPS | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.authHost is required" .Values.ingress.authHost | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ required "ingress.authHost is required" .Values.ingress.authHost | quote }}
      http:
        paths:
          # Machine-only Admin REST surface required by keycloak/keycloak.
          # The browser console path (/admin/*/console) never matches.
          - path: /admin/(realms|serverinfo)(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.ingress.keycloakServiceName }}
                port: { number: 8080 }
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yourown-chat-authorization-api
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Authorization codes arrive through form_post and this ingress emits no
    # request log, preventing future parameter changes from leaking secrets.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.authLimitConnections | quote }}
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.authLimitRPS | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.authLimitBurstMultiplier | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.authHost is required" .Values.ingress.authHost | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ required "ingress.authHost is required" .Values.ingress.authHost | quote }}
      http:
        paths:
          - path: ^/(\.well-known/oauth-authorization-server|authorize|callback|token)?/?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: yourown-chat-auth-api
                port: { number: 8083 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yourown-chat-identity-api
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Enumerate the authenticated public API. The admin binary and its
          # /internal route have no ingress at all.
          - path: /identity(/|$)(v1/(users|workspaces)(/.*)?)
            pathType: ImplementationSpecific
            backend:
              service:
                name: yourown-chat-identity-api
                port: { number: 8081 }
          - path: /identity(/|$)(v1/auth/sessions/current)/?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: yourown-chat-identity-api
                port: { number: 8081 }
{{- end }}
