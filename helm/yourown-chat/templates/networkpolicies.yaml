{{- if .Values.networkPolicy.enabled }}
{{- range $namespace := list .Values.namespaces.edge .Values.namespaces.identity .Values.namespaces.control }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transport
  namespace: {{ .Values.namespaces.edge }}
spec:
  podSelector:
    matchLabels: { app: transport }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector:
            matchLabels: { app: verify }
      ports: [{ protocol: TCP, port: 8084 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - ipBlock: { cidr: {{ printf "%s/32" (required "cluster_dns_ip is required" .Values.cluster_dns_ip) | quote }} }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock: { cidr: {{ printf "%s/32" (required "cloudsql_private_ip is required" .Values.cloudsql_private_ip) | quote }} }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - podSelector:
            matchLabels: { app: auth }
      ports: [{ protocol: TCP, port: 8083 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespaces.identity }} }
          podSelector:
            matchLabels: { app: api }
      ports: [{ protocol: TCP, port: 8081 }]
    {{- if .Values.yourown_chat_control_api_enabled }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespaces.control }} }
          podSelector:
            matchLabels: { app: control }
      ports: [{ protocol: TCP, port: 8080 }]
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mattermost }
      ports: [{ protocol: TCP, port: 8065 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth
  namespace: {{ .Values.namespaces.edge }}
spec:
  podSelector:
    matchLabels: { app: auth }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector:
            matchLabels: { app: transport }
        - podSelector:
            matchLabels: { app: verify }
      ports: [{ protocol: TCP, port: 8083 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - ipBlock: { cidr: {{ printf "%s/32" (required "cluster_dns_ip is required" .Values.cluster_dns_ip) | quote }} }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock: { cidr: {{ printf "%s/32" (required "cloudsql_private_ip is required" .Values.cloudsql_private_ip) | quote }} }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: {{ .Values.namespaces.identity }}
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespaces.edge }} }
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [transport, verify]
      ports: [{ protocol: TCP, port: 8081 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - ipBlock: { cidr: {{ printf "%s/32" (required "cluster_dns_ip is required" .Values.cluster_dns_ip) | quote }} }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock: { cidr: {{ printf "%s/32" (required "cloudsql_private_ip is required" .Values.cloudsql_private_ip) | quote }} }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mattermost }
      ports: [{ protocol: TCP, port: 8065 }]
    {{- if .Values.networkPolicy.allowExternalMattermost }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin
  namespace: {{ .Values.namespaces.identity }}
spec:
  podSelector:
    matchLabels: { app: admin }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: admin-client }
      ports: [{ protocol: TCP, port: 8082 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - ipBlock: { cidr: {{ printf "%s/32" (required "cluster_dns_ip is required" .Values.cluster_dns_ip) | quote }} }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock: { cidr: {{ printf "%s/32" (required "cloudsql_private_ip is required" .Values.cloudsql_private_ip) | quote }} }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: {{ .Values.namespaces.identity }}
spec:
  podSelector:
    matchLabels: { app: migrate }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - ipBlock: { cidr: {{ printf "%s/32" (required "cluster_dns_ip is required" .Values.cluster_dns_ip) | quote }} }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock: { cidr: {{ printf "%s/32" (required "cloudsql_private_ip is required" .Values.cloudsql_private_ip) | quote }} }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verify
  namespace: {{ .Values.namespaces.edge }}
spec:
  podSelector:
    matchLabels: { app: verify }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [transport, auth]
      ports: [{ protocol: TCP, port: 8084 }, { protocol: TCP, port: 8083 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespaces.identity }} }
          podSelector:
            matchLabels: { app: api }
      ports: [{ protocol: TCP, port: 8081 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - ipBlock: { cidr: {{ printf "%s/32" (required "cluster_dns_ip is required" .Values.cluster_dns_ip) | quote }} }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
{{- if .Values.yourown_chat_control_api_enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control
  namespace: {{ .Values.namespaces.control }}
spec:
  podSelector:
    matchLabels: { app: control }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mattermost }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespaces.edge }} }
          podSelector:
            matchLabels: { app: transport }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: temporal }
      ports: [{ protocol: TCP, port: 7233 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mattermost }
      ports: [{ protocol: TCP, port: 8065 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
        - ipBlock: { cidr: {{ printf "%s/32" (required "cluster_dns_ip is required" .Values.cluster_dns_ip) | quote }} }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
{{- end }}
{{- end }}
