# Cloud Deploy uses Helm only for rendering and applies the resulting immutable
# manifests with Skaffold/kubectl. Workload-specific pipelines select exactly
# one profile family, so an MCP release never touches Mattermost or PostgreSQL.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: yourown-chat

deploy:
  kubectl: {}

profiles:
  # Ephemeral migration/smoke environment. Persistent PostgreSQL is owned by
  # Terraform's dev-postgres resources and is intentionally absent here.
  - name: mattermost-dev
    manifests:
      helm:
        releases:
          - name: mattermost-dev
            chartPath: mattermost
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mattermost/values.yaml
              - mattermost/values-dev.yaml
    verify:
      - name: smoke-test
        container:
          name: smoke-test
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - >-
              curl -sSf --retry 30 --retry-connrefused --retry-delay 5
              http://dev-mattermost.dev.svc.cluster.local:8065/api/v4/system/ping
        executionMode:
          kubernetesCluster:
            jobManifestPath: mattermost/verify/job.yaml

  # Optional bridge is additive only to the Mattermost dev stage.
  - name: matterbridge
    manifests:
      rawYaml:
        - matterbridge/serviceaccount.yaml
        - matterbridge/secretproviderclass.yaml
        - matterbridge/networkpolicy.yaml
        - matterbridge/deployment.yaml

  - name: mattermost-prod
    manifests:
      helm:
        releases:
          - name: mattermost-prod
            chartPath: mattermost
            namespace: mattermost
            createNamespace: false
            valuesFiles:
              - mattermost/values.yaml
              - mattermost/values-prod.yaml

  # Disposable MCP instances share the isolated, quota-bound dev namespace.
  # Production keeps one namespace per MCP server.
  - name: mcp-dev
    manifests:
      helm:
        releases:
          - name: dev-mcp-terraform
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-terraform.yaml
          - name: dev-mcp-google-cloud
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-google-cloud.yaml
          - name: dev-mcp-google-workspace
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-google-workspace.yaml
          - name: dev-mcp-whatsapp-business
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-whatsapp-business.yaml
  - name: mcp-prod
    manifests:
      helm:
        releases:
          - name: mcp-tunnel
            chartPath: mcp
            namespace: mcp-tunnel
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-tunnel.yaml
          - name: mcp-terraform
            chartPath: mcp
            namespace: mcp-terraform
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-terraform.yaml
          - name: mcp-google-cloud
            chartPath: mcp
            namespace: mcp-google-cloud
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-google-cloud.yaml
          - name: mcp-google-workspace
            chartPath: mcp
            namespace: mcp-google-workspace
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-google-workspace.yaml
              - mcp/values-google-workspace-prod.yaml
          - name: mcp-whatsapp-business
            chartPath: mcp
            namespace: mcp-whatsapp-business
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-whatsapp-business.yaml
    verify:
      - name: mcp-smoke-test
        container:
          name: smoke-test
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              retry='--retry 30 --retry-all-errors --retry-delay 5';
              curl -sSf $retry \
                http://mcp-terraform.mcp-terraform.svc.cluster.local:8080/health
              curl -sSf $retry \
                http://mcp-google-cloud.mcp-google-cloud.svc.cluster.local:8080/healthz
              curl -sSf $retry \
                http://mcp-google-workspace.mcp-google-workspace.svc.cluster.local:8000/health
              curl -sSf $retry \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/health

              init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"cloud-deploy-prod-smoke","version":"1.0"}}}'

              mcp_api_smoke() {
                name="$1"
                url="$2"
                tool="$3"
                arguments="$4"
                headers="/tmp/${name}.headers"
                body="/tmp/${name}.body"

                curl -sSf $retry -D "$headers" -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  --data "$init" "$url"
                grep -q '"result"' "$body"

                session_id="$(grep -i '^mcp-session-id:' "$headers" |
                  tail -n1 | cut -d: -f2- | tr -d ' \r')"
                test -n "$session_id"

                curl -sSf -o /dev/null -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  -H "Mcp-Session-Id: $session_id" \
                  --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                  "$url"

                payload="$(printf \
                  '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"%s","arguments":%s}}' \
                  "$tool" "$arguments")"
                curl -sSf -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  -H "Mcp-Session-Id: $session_id" \
                  --data "$payload" "$url"
                grep -q '"result"' "$body"
                ! grep -Eq '"isError"[[:space:]]*:[[:space:]]*true' "$body"
                ! grep -Eq '"error"[[:space:]]*:' "$body"
              }

              # These are real, read-only upstream API calls. They fail on
              # placeholder/revoked credentials or missing IAM permissions.
              mcp_api_smoke terraform \
                http://mcp-terraform.mcp-terraform.svc.cluster.local:8080/mcp \
                list_terraform_orgs '{}'
              mcp_api_smoke google-cloud \
                http://mcp-google-cloud.mcp-google-cloud.svc.cluster.local:8080/mcp \
                list_log_names '{"parent":"projects/yourown-chat","pageSize":1}'
              mcp_api_smoke whatsapp-business \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/mcp \
                whatsapp_get_phone_number '{}'

              # Workspace uses per-user OAuth. CI has no user grant by design;
              # startup validates the prod OAuth client config, while this
              # verifies that protocol-level auth rejects an anonymous client.
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                --data "$init" \
                http://mcp-google-workspace.mcp-google-workspace.svc.cluster.local:8000/mcp)"
              test "$code" = 401
        executionMode:
          kubernetesCluster:
            jobManifestPath: mcp/verify/prod-job.yaml

# executionMode is intentionally omitted for cleanup actions. Cloud Deploy
# therefore runs these containers in its Cloud Build execution environment
# under the target's dedicated PREDEPLOY service account, not as pods in GKE.
customActions:
  - name: cleanup-mattermost-dev
    containers:
      - name: cleanup-mattermost-dev
        image: gcr.io/cloud-builders/kubectl@sha256:3744bfd3765ac2a09133a164fcd74c8468fac192af8accadbdfbccbb20643961
        command: ["/bin/sh", "-ceu"]
        args:
          - |
            cluster_name="${GKE_CLUSTER##*/}"
            cluster_parent="${GKE_CLUSTER%/clusters/*}"
            cluster_location="${cluster_parent##*/}"
            cluster_project_path="${cluster_parent%/locations/*}"
            cluster_project="${cluster_project_path##*/}"
            gcloud container clusters get-credentials "${cluster_name}" \
              --project "${cluster_project}" \
              --location "${cluster_location}"
            kubectl --namespace dev scale deployment/dev-mattermost --replicas=0

  - name: cleanup-mcp-dev
    containers:
      - name: cleanup-mcp-dev
        image: gcr.io/cloud-builders/kubectl@sha256:3744bfd3765ac2a09133a164fcd74c8468fac192af8accadbdfbccbb20643961
        command: ["/bin/sh", "-ceu"]
        args:
          - |
            cluster_name="${GKE_CLUSTER##*/}"
            cluster_parent="${GKE_CLUSTER%/clusters/*}"
            cluster_location="${cluster_parent##*/}"
            cluster_project_path="${cluster_parent%/locations/*}"
            cluster_project="${cluster_project_path##*/}"
            gcloud container clusters get-credentials "${cluster_name}" \
              --project "${cluster_project}" \
              --location "${cluster_location}"
            kubectl --namespace dev scale deployment/dev-mcp-terraform --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-google-cloud --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-google-workspace --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-whatsapp-business --replicas=0
