apiVersion: v2
name: platform-service
description: >-
  YourOwn.Chat platform workload profile for a stateless networked service.
  Renders a Deployment, ClusterIP Service, deny-by-default NetworkPolicy,
  ServiceAccount, optional Secret Manager CSI provider class, optional typed
  HTTP ingress, HorizontalPodAutoscaler and PodDisruptionBudget. Service
  wrappers pin an exact published version and supply only schema-validated
  values.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
keywords:
  - yourown-chat
  - platform-profile
home: https://github.com/pilprod/yourown-chat/tree/main/helm/platform
sources:
  - https://github.com/pilprod/yourown-chat
annotations:
  platform.yourown.chat/profile: platform-service
  platform.yourown.chat/contract: "Public Helm platform policy (.ai/helm-policy.md)"
