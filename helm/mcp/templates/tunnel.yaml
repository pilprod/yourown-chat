{{- if .Values.tunnel.enabled }}
---
# Cloudflare Tunnel connector: outbound-only link carrying Access-authenticated
# traffic to private services (internal MCP servers + dev Mattermost) with zero
# public exposure. Ingress rules live in the cloudflare zero-trust module; the
# pod reads its token directly from Secret Manager through the GKE CSI driver
# in its dedicated mcp-tunnel namespace; it is the only cross-namespace path
# admitted to MCP services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tunnel
  namespace: {{ .Release.Namespace }}
  labels:
    app: mcp-tunnel
    app.kubernetes.io/part-of: mcp-servers
spec:
  replicas: {{ .Values.tunnel.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: mcp-tunnel
  template:
    metadata:
      labels:
        app: mcp-tunnel
        app.kubernetes.io/part-of: mcp-servers
    spec:
      priorityClassName: {{ .Values.defaults.priorityClassName }}
      serviceAccountName: {{ .Values.tunnel.serviceAccountName }}
      securityContext:
        {{- toYaml .Values.defaults.podSecurityContext | nindent 8 }}
      containers:
        - name: cloudflared
          {{- with .Values.tunnel.image.deployParameter }}
          image: {{ required (printf "Cloud Deploy parameter %s is required" .) (get $.Values .) | quote }}
          {{- else }}
          image: "{{ .Values.tunnel.image.repository }}:{{ .Values.tunnel.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.tunnel.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.defaults.securityContext | nindent 12 }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /var/run/secrets/mcp/tunnel-token
          volumeMounts:
            - name: mcp-secrets
              mountPath: /var/run/secrets/mcp
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.defaults.resources | nindent 12 }}
      volumes:
        - name: mcp-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mcp-tunnel-gcp
      nodeSelector:
        {{- toYaml .Values.defaults.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.defaults.tolerations | nindent 8 }}
{{- end }}
