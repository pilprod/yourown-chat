{{- range $name, $server := .Values.servers }}
{{- $secretProvider := $server.secretProvider | default dict }}
{{- if and $server.enabled ($secretProvider.enabled | default false) }}
{{- $resourceName := include "mcp-servers.serverName" (dict "root" $ "name" $name) }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $resourceName }}-gcp
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: mcp-servers
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $file := $secretProvider.files }}
      - resourceName: "projects/{{ required "Cloud Deploy parameter mcp_secret_project is required" $.Values.mcp_secret_project }}/secrets/{{ $file.secretName }}/versions/latest"
        path: {{ $file.path | quote }}
      {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.tunnel.enabled .Values.tunnel.secretProvider.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mcp-tunnel-gcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: mcp-servers
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $file := .Values.tunnel.secretProvider.files }}
      - resourceName: "projects/{{ required "Cloud Deploy parameter mcp_secret_project is required" $.Values.mcp_secret_project }}/secrets/{{ $file.secretName }}/versions/latest"
        path: {{ $file.path | quote }}
      {{- end }}
{{- end }}
