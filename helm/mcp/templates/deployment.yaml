{{- range $name, $server := .Values.servers }}
{{- if $server.enabled }}
{{- $resourceName := include "mcp-servers.serverName" (dict "root" $ "name" $name) }}
{{- $mcpPath := $server.mcpPath | default "/mcp" }}
{{- $secretProvider := $server.secretProvider | default dict }}
{{- $secretProviderEnabled := $secretProvider.enabled | default false }}
{{- $persistence := $server.persistence | default dict }}
{{- $persistenceEnabled := $persistence.enabled | default false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $resourceName }}
    app.kubernetes.io/part-of: mcp-servers
    {{- if $.Values.agentRegistry.enabled }}
    registry.gke.io/functional-type: "MCP_SERVER"
    {{- end }}
  {{- if $.Values.agentRegistry.enabled }}
  annotations:
    modelcontextprotocol.info/urls: |
      - http://{{ $resourceName }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ $server.port }}{{ $mcpPath }}
    modelcontextprotocol.info/capabilities: |
      card:
        endpoint: {{ $mcpPath | quote }}
        protocol: "HTTP"
  {{- end }}
spec:
  replicas: {{ $server.replicaCount | default 1 }}
  {{- with $server.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $resourceName }}
  template:
    metadata:
      {{- if $.Values.agentRegistry.enabled }}
      annotations:
        iam.gke.io/spiffe-identity-type: agent-identity
      {{- end }}
      labels:
        app: {{ $resourceName }}
        app.kubernetes.io/part-of: mcp-servers
    spec:
      priorityClassName: {{ $server.priorityClassName | default $.Values.defaults.priorityClassName }}
      {{- with $server.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "mcp-servers.valueOrDefault" (dict "server" $server "defaults" $.Values.defaults "key" "podSecurityContext") | nindent 8 }}
      {{- with $server.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- with $server.image.deployParameter }}
          image: {{ required (printf "Cloud Deploy parameter %s is required" .) (get $.Values .) | quote }}
          {{- else }}
          image: "{{ $server.image.repository }}:{{ $server.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $server.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "mcp-servers.valueOrDefault" (dict "server" $server "defaults" $.Values.defaults "key" "securityContext") | nindent 12 }}
          {{- with $server.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $server.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $server.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if or $secretProviderEnabled $persistenceEnabled $server.volumeMounts }}
          volumeMounts:
            {{- if $secretProviderEnabled }}
            - name: mcp-secrets
              mountPath: /var/run/secrets/mcp
              readOnly: true
            {{- end }}
            {{- if $persistenceEnabled }}
            - name: data
              mountPath: {{ $persistence.mountPath | default "/var/lib/mcp" }}
            {{- end }}
            {{- with $server.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $server.port }}
              protocol: TCP
          {{- with $server.health }}
          startupProbe:
            httpGet:
              path: {{ .path }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          {{- end }}
          resources:
            {{- include "mcp-servers.valueOrDefault" (dict "server" $server "defaults" $.Values.defaults "key" "resources") | nindent 12 }}
      {{- if or $secretProviderEnabled $persistenceEnabled $server.volumes }}
      volumes:
        {{- if $secretProviderEnabled }}
        - name: mcp-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $resourceName }}-gcp
        {{- end }}
        {{- if $persistenceEnabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $resourceName }}-data
        {{- end }}
        {{- with $server.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      nodeSelector:
        {{- include "mcp-servers.valueOrDefault" (dict "server" $server "defaults" $.Values.defaults "key" "nodeSelector") | nindent 8 }}
      tolerations:
        {{- include "mcp-servers.valueOrDefault" (dict "server" $server "defaults" $.Values.defaults "key" "tolerations") | nindent 8 }}
{{- end }}
{{- end }}
