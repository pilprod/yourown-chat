{{- if .Values.serviceAccount.create }}
# Shared Workload Identity KSA for servers needing keyless GCP access, bound to
# the platform `mcp` GSA. This is rendered by the Google Cloud release in its
# production namespace and by the disposable Google Cloud release in `dev`.
# Annotation value injected via the mcp_gsa deploy parameter.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: mcp-servers
  annotations:
    iam.gke.io/gcp-service-account: {{ required "Cloud Deploy parameter mcp_gsa is required" .Values.mcp_gsa | quote }}
{{- end }}
