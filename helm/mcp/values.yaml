# In-cluster MCP servers, one entry per server under `servers:` (renders
# Deployment + Service + NetworkPolicy named mcp-<key>). Per-server switchboard;
# the whole set is gated by the app-gcp mcp_servers_enabled flag. Servers are
# reachable only from the dedicated mcp-tunnel namespace. Mattermost uses the
# public Cloudflare MCP Portal and has no direct cross-namespace path.
# Skaffold renders one release per server namespace.
# Credentials never live in chart values or Kubernetes Secrets. Secret Manager
# CSI mounts versions/latest as read-only files under /var/run/secrets/mcp.

# Cloud Deploy supplies these to Skaffold's Helm renderer as --set values.
# Enabled templates require them, so missing release parameters fail during
# render instead of reaching GKE as placeholder images.
mcp_terraform_stacks_image: ""
mcp_google_cloud_image: ""
mcp_tunnel_image: ""
mcp_secret_project: ""
mcp_google_cloud_gsa: ""
mcp_terraform_stacks_gsa: ""
mcp_tunnel_gsa: ""

# Ephemeral development releases use `dev-`; production keeps this empty.
namePrefix: ""

# Production GKE Deployments are discovered and introspected by Google Cloud
# Agent Registry. The dev overlay disables this: disposable dev instances
# must not leave stale catalog entries after they are scaled to zero.
agentRegistry:
  enabled: true

tunnel:
  # Cloudflare Tunnel connector for Zero Trust access to the private services
  # (internal MCP servers + dev Mattermost). Enabled with zero_trust_enabled in
  # both stacks; waits in CreateContainerConfigError until app-gcp materialises
  # the mcp-tunnel Secret, then starts. See docs/MCP.md.
  enabled: true
  image:
    deployParameter: mcp_tunnel_image
    pullPolicy: IfNotPresent
  serviceAccountName: mcp-tunnel
  gcpServiceAccountDeployParameter: mcp_tunnel_gsa
  secretProvider:
    enabled: true
    files:
      - secretName: mcp-tunnel-token
        path: tunnel-token

defaults:
  priorityClassName: production
  nodeSelector: {}
  tolerations: []

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 32Mi

  networkPolicy:
    enabled: true
    namespaceDefaults: true
    allowGkeMetadata: false
    allowKubernetesApi: false
    kubernetesApiCidr: "10.30.0.1/32"
    allowTunnel: true
    # cloudflared is the only cross-namespace caller. Interactive Mattermost,
    # Claude and ChatGPT clients all traverse the Cloudflare MCP Portal.
    allowedNamespaces: []
    tunnelNamespace: mcp-tunnel

servers:
  # First-party, policy-constrained HCP Terraform Stacks lifecycle server.
  # It covers settings, VCS/reuse configurations, creation/update, guarded
  # destroy-all planning, empty-Stack deletion, deployment review and exact
  # run approval without exposing the unused workspace/Registry MCP.
  terraform-stacks:
    enabled: true
    serviceAccountName: mcp-terraform-stacks
    gcpServiceAccountDeployParameter: mcp_terraform_stacks_gsa
    image:
      deployParameter: mcp_terraform_stacks_image
      pullPolicy: IfNotPresent
    port: 3000
    env:
      PORT: "3000"
      TFE_ADDRESS: "https://app.terraform.io"
      TFE_ORGANIZATION: "papou-work"
      # Approval remains name-based and intentionally narrower than Stack
      # creation/update management policy.
      TFE_STACK_ALLOWLIST: "cloudflare,app-gcp,platform-gcp,agent-registry-gcp"
      TFE_STACK_PROJECT_ALLOWLIST: "prj-QuYKhn6EzLX9jB53"
      TFE_STACK_REPOSITORY_ALLOWLIST: "pilprod/yourown-chat"
      TFE_STACK_DIRECTORY_PREFIX_ALLOWLIST: "terraform/"
      TFE_STACK_GITHUB_APP_INSTALLATION_ID: "ghain-PoBaBziU2edUHeaR"
      TFE_TOKEN_FILE: /var/run/secrets/mcp/tfe-token
    secretProvider:
      enabled: true
      files:
        - secretName: mcp-terraform-hcp-token
          path: tfe-token
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 256Mi
    health:
      path: /health

  # Our reproducible static Go image contains the observability and guarded
  # lifecycle tools and is built from the private yourown-chat-mcp source by
  # the MCP release trigger. Cloud Deploy replaces the
  # marker below with the immutable image digest produced by that build.
  # Keyless: the mcp-servers KSA -> `mcp` GSA supplies ADC.
  google-cloud:
    enabled: true
    serviceAccountName: mcp-servers
    gcpServiceAccountDeployParameter: mcp_google_cloud_gsa
    image:
      deployParameter: mcp_google_cloud_image
      pullPolicy: IfNotPresent
    port: 8080
    env:
      GOOGLE_CLOUD_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_SECURITY_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_SECURITY_LOCATION: "europe-west3"
      GOOGLE_CLOUD_SECURITY_REPOSITORIES: "docker"
      GOOGLE_CLOUD_QUOTA_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_DEPLOY_ENABLED: "true"
      GOOGLE_CLOUD_DEPLOY_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_DEPLOY_LOCATION: "europe-west3"
      GOOGLE_CLOUD_DEPLOY_PIPELINE_TARGETS: "mattermost=mattermost-dev|mattermost-prod,mattermost-preview=mattermost-preview-dev,mcp=mcp-dev|mcp-prod,yourown-chat=yourown-chat-pilot,agents-start=agents-start-pilot,agents-pause=agents-pause-pilot,kagent-substrate=kagent-substrate-testbed"
      GOOGLE_CLOUD_DEPLOY_CLEANUP_ENABLED: "true"
      GOOGLE_CLOUD_DEPLOY_DEV_WORKLOADS: "mattermost=dev/dev-mattermost,mattermost-preview=dev/dev-mattermost,mcp=dev/dev-mcp-terraform-stacks|dev/dev-mcp-google-cloud"
      GOOGLE_CLOUD_BUILD_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_BUILD_LOCATION: "europe-west3"
      GOOGLE_CLOUD_BILLING_PROJECT: "yourown-chat"
      # Cloud Billing creates this table after Detailed usage cost export is
      # enabled for the Terraform-managed `billing` dataset.
      GOOGLE_CLOUD_BILLING_EXPORT_TABLE: "yourown-chat.billing.gcp_billing_export_resource_v1_01B729_537989_CCA4BB"
      GOOGLE_CLOUD_BILLING_EXPORT_LOCATION: "EU"
      # Hard per-query ceiling: 1 GB scanned; over-limit queries fail for free.
      GOOGLE_CLOUD_BILLING_MAXIMUM_BYTES_BILLED: "1000000000"
      GOOGLE_CLOUD_RECOMMENDER_LOCATIONS: "global,europe-west3,europe-west3-b"
      HOME: /tmp
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 500m
        # Logging responses are materialized by the aggregator and the single
        # shared official Observability child; this covers response bursts.
        memory: 2Gi
    health:
      path: /healthz
