# In-cluster MCP servers, one entry per server under `servers:` (renders
# Deployment + Service + NetworkPolicy named mcp-<key>). Per-server switchboard;
# the whole set is gated by the app-gcp mcp_servers_enabled flag. Servers are
# reachable only from the mattermost namespace or the dedicated mcp-tunnel
# namespace. Skaffold renders one release per server namespace.
# Credentials never live in chart values or Kubernetes Secrets. Secret Manager
# CSI mounts versions/latest as read-only files under /var/run/secrets/mcp.

# Cloud Deploy supplies these to Skaffold's Helm renderer as --set values.
# Enabled templates require them, so missing release parameters fail during
# render instead of reaching GKE as placeholder images.
mcp_terraform_image: ""
mcp_terraform_stacks_image: ""
mcp_google_cloud_image: ""
mcp_whatsapp_business_image: ""
mcp_whatsapp_personal_image: ""
mcp_tunnel_image: ""
mcp_secret_project: ""
mcp_google_cloud_gsa: ""
mcp_terraform_gsa: ""
mcp_terraform_stacks_gsa: ""
mcp_whatsapp_gsa: ""
mcp_whatsapp_personal_gsa: ""
mcp_tunnel_gsa: ""

# Ephemeral development releases use `dev-`; production keeps this empty.
namePrefix: ""

# Production GKE Deployments are discovered and introspected by Google Cloud
# Agent Registry. The dev overlay disables this: disposable dev instances
# must not leave stale catalog entries after they are scaled to zero.
agentRegistry:
  enabled: true

tunnel:
  # Cloudflare Tunnel connector for Zero Trust access to the private services
  # (internal MCP servers + dev Mattermost). Enabled with zero_trust_enabled in
  # both stacks; waits in CreateContainerConfigError until app-gcp materialises
  # the mcp-tunnel Secret, then starts. See docs/MCP.md.
  enabled: true
  image:
    deployParameter: mcp_tunnel_image
    pullPolicy: IfNotPresent
  serviceAccountName: mcp-tunnel
  gcpServiceAccountDeployParameter: mcp_tunnel_gsa
  secretProvider:
    enabled: true
    files:
      - secretName: mcp-tunnel-token
        path: tunnel-token

defaults:
  priorityClassName: production
  nodeSelector: {}
  tolerations: []

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

  networkPolicy:
    enabled: true
    namespaceDefaults: true
    allowGkeMetadata: false
    allowTunnel: true
    # Mattermost is the only cross-namespace caller. The chart additionally
    # permits the dedicated cloudflared connector for Zero Trust traffic.
    allowedNamespaces:
      - mattermost
    tunnelNamespace: mcp-tunnel

servers:
  # Official image. Registry lookups are tokenless; HCP Terraform
  # (workspaces/runs/stacks) needs TFE_TOKEN from mcp-terraform-hcp. TFE_ADDRESS
  # is fixed server-side (per-request overrides are rejected 403).
  terraform:
    enabled: true
    serviceAccountName: mcp-terraform
    gcpServiceAccountDeployParameter: mcp_terraform_gsa
    image:
      deployParameter: mcp_terraform_image
      pullPolicy: IfNotPresent
    port: 8080
    args:
      - "streamable-http"
      - "--transport-host"
      - "0.0.0.0"
      - "--transport-port"
      - "8080"
      - "--mcp-endpoint"
      - "/mcp"
      - "--toolsets"
      - "registry,terraform"
    env:
      MCP_ALLOWED_ORIGINS: "https://yourown.chat"
      TFE_ADDRESS: "https://app.terraform.io"
      TFE_TOKEN_FILE: /var/run/secrets/mcp/tfe-token
    secretProvider:
      enabled: true
      files:
        - secretName: mcp-terraform-hcp-token
          path: tfe-token
    health:
      path: /health

  # Small first-party adapter for HCP Terraform Stacks deployment runs. The
  # official HashiCorp MCP currently exposes Stack discovery but not deployment
  # plan review/approval. This server resolves Stack IDs by an explicit
  # name allowlist and never grants a deployment-group/global approval.
  terraform-stacks:
    enabled: true
    serviceAccountName: mcp-terraform-stacks
    gcpServiceAccountDeployParameter: mcp_terraform_stacks_gsa
    image:
      deployParameter: mcp_terraform_stacks_image
      pullPolicy: IfNotPresent
    port: 3000
    env:
      PORT: "3000"
      TFE_ADDRESS: "https://app.terraform.io"
      TFE_ORGANIZATION: "papou-work"
      # Approval remains name-based and intentionally narrower than Stack
      # creation/update management policy.
      TFE_STACK_ALLOWLIST: "cloudflare,app-gcp,platform-gcp,agent-registry-gcp"
      TFE_STACK_PROJECT_ALLOWLIST: "prj-QuYKhn6EzLX9jB53"
      TFE_STACK_REPOSITORY_ALLOWLIST: "pilprod/yourown-chat"
      TFE_STACK_DIRECTORY_PREFIX_ALLOWLIST: "terraform/"
      TFE_STACK_GITHUB_APP_INSTALLATION_ID: "ghain-PoBaBziU2edUHeaR"
      TFE_TOKEN_FILE: /var/run/secrets/mcp/tfe-token
    secretProvider:
      enabled: true
      files:
        - secretName: mcp-terraform-hcp-token
          path: tfe-token
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    health:
      path: /health

  # Our reproducible image contains pinned
  # @google-cloud/observability-mcp + native HTTP aggregator and is built by the
  # MCP release trigger into Artifact Registry. Cloud Deploy replaces the
  # marker below with the immutable image digest produced by that build.
  # Keyless: the mcp-servers KSA -> `mcp` GSA supplies ADC.
  google-cloud:
    enabled: true
    serviceAccountName: mcp-servers
    gcpServiceAccountDeployParameter: mcp_google_cloud_gsa
    image:
      deployParameter: mcp_google_cloud_image
      pullPolicy: IfNotPresent
    port: 8080
    env:
      GOOGLE_CLOUD_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_SECURITY_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_SECURITY_LOCATION: "europe-west3"
      GOOGLE_CLOUD_SECURITY_REPOSITORIES: "docker"
      GOOGLE_CLOUD_QUOTA_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_DEPLOY_ENABLED: "true"
      GOOGLE_CLOUD_DEPLOY_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_DEPLOY_LOCATION: "europe-west3"
      GOOGLE_CLOUD_DEPLOY_PIPELINE_TARGETS: "mattermost=mattermost-dev|mattermost-prod,mcp=mcp-dev|mcp-prod"
      GOOGLE_CLOUD_BUILD_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_BUILD_LOCATION: "europe-west3"
      HOME: /tmp
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: 500m
        # Logging responses are materialized by the aggregator and the single
        # shared official Observability child; this covers response bursts.
        memory: 2Gi
    health:
      path: /healthz

  # Community transport adapter over Meta's official WhatsApp Business Cloud
  # API. This is not a WhatsApp Web/QR bridge. Account credentials are mounted
  # directly from Secret Manager through CSI.
  whatsapp-business:
    enabled: true
    # The bounded JSON index has exactly one writer on a ReadWriteOnce PVC.
    # Recreate prevents a rolling release from briefly running two writers and
    # corrupting the store. Move back to RollingUpdate only after issue #71
    # migrates the index to transactional PostgreSQL.
    replicaCount: 1
    strategy:
      type: Recreate
    serviceAccountName: mcp-whatsapp-business
    gcpServiceAccountDeployParameter: mcp_whatsapp_gsa
    image:
      deployParameter: mcp_whatsapp_business_image
      pullPolicy: IfNotPresent
    port: 3000
    env:
      PORT: "3000"
      WHATSAPP_API_VERSION: "v23.0"
      WHATSAPP_ACCESS_TOKEN_FILE: /var/run/secrets/mcp/access-token
      WHATSAPP_WABA_ID_FILE: /var/run/secrets/mcp/waba-id
      WHATSAPP_PHONE_NUMBER_ID_FILE: /var/run/secrets/mcp/phone-number-id
      WHATSAPP_APP_SECRET_FILE: /var/run/secrets/mcp/app-secret
      WHATSAPP_WEBHOOK_VERIFY_TOKEN_FILE: /var/run/secrets/mcp/webhook-verify-token
      WHATSAPP_MESSAGE_STORE: /var/lib/whatsapp-mcp/messages.json
      WHATSAPP_MESSAGE_RETENTION: "5000"
      WHATSAPP_WEBHOOK_BODY_LIMIT: "16mb"
    secretProvider:
      enabled: true
      files:
        - secretName: mcp-whatsapp-access-token
          path: access-token
        - secretName: mcp-whatsapp-waba-id
          path: waba-id
        - secretName: mcp-whatsapp-phone-number-id
          path: phone-number-id
        - secretName: mcp-whatsapp-app-secret
          path: app-secret
        - secretName: mcp-whatsapp-webhook-verify-token
          path: webhook-verify-token
    persistence:
      enabled: true
      mountPath: /var/lib/whatsapp-mcp
      size: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    health:
      path: /health

  # Personal WhatsApp linked-device client. Unlike whatsapp-business this uses
  # an unofficial WhatsApp Web implementation and a QR-linked session. The
  # mutable auth state is a long-lived credential on its dedicated PVC.
  whatsapp-personal:
    enabled: true
    replicaCount: 1
    strategy:
      type: Recreate
    serviceAccountName: mcp-whatsapp-personal
    gcpServiceAccountDeployParameter: mcp_whatsapp_personal_gsa
    image:
      deployParameter: mcp_whatsapp_personal_image
      pullPolicy: IfNotPresent
    port: 3000
    env:
      PORT: "3000"
      WHATSAPP_PERSONAL_CONNECT_ENABLED: "true"
      WHATSAPP_PERSONAL_PROXY_URL_FILE: /var/run/secrets/mcp/proxy-url
      WHATSAPP_PERSONAL_DATA_DIR: /var/lib/whatsapp-personal
      WHATSAPP_PERSONAL_MESSAGE_RETENTION: "5000"
      WHATSAPP_PERSONAL_HOURLY_LIMIT: "6"
      WHATSAPP_PERSONAL_DAILY_LIMIT: "20"
      WHATSAPP_PERSONAL_MINIMUM_INTERVAL_SECONDS: "30"
      WHATSAPP_PERSONAL_MAXIMUM_UNANSWERED: "2"
    secretProvider:
      enabled: true
      files:
        - secretName: mcp-whatsapp-personal-proxy-url
          path: proxy-url
    persistence:
      enabled: true
      mountPath: /var/lib/whatsapp-personal
      size: 1Gi
      storageClassName: mcp-sensitive
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    health:
      path: /health
