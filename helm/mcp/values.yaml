# In-cluster MCP servers, one entry per server under `servers:` (renders
# Deployment + Service + NetworkPolicy named mcp-<key>). Per-server switchboard;
# the whole set is gated by the app-gcp mcp_servers_enabled flag. Servers are
# reachable only from the mattermost namespace or the dedicated mcp-tunnel
# namespace. Skaffold renders one release per server namespace.
# Credentials never live here -- set secretEnvFrom and create the Secret via the
# app-gcp cluster_secrets component. See docs/MCP.md.

# Cloud Deploy supplies these to Skaffold's Helm renderer as --set values.
# Enabled templates require them, so missing release parameters fail during
# render instead of reaching GKE as placeholder images.
mcp_terraform_image: ""
mcp_google_cloud_image: ""
mcp_whatsapp_business_image: ""
mcp_tunnel_image: ""
mcp_gsa: ""

# Ephemeral development releases use `dev-`; production keeps this empty.
namePrefix: ""

# Production GKE Deployments are discovered and introspected by Google Cloud
# Agent Registry. The dev overlay disables this: disposable dev instances
# must not leave stale catalog entries after they are scaled to zero.
agentRegistry:
  enabled: true

tunnel:
  # Cloudflare Tunnel connector for Zero Trust access to the private services
  # (internal MCP servers + dev Mattermost). Enabled with zero_trust_enabled in
  # both stacks; waits in CreateContainerConfigError until app-gcp materialises
  # the mcp-tunnel Secret, then starts. See docs/MCP.md.
  enabled: true
  image:
    deployParameter: mcp_tunnel_image
    pullPolicy: IfNotPresent
  secretEnvFrom: mcp-tunnel

serviceAccount:
  # Shared KSA bound (Workload Identity) to the platform `mcp` GSA -- keyless
  # read-only observability. Servers opt in via servers.<name>.serviceAccountName.
  create: true
  name: mcp-servers

defaults:
  priorityClassName: production
  nodeSelector: {}
  tolerations: []

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

  networkPolicy:
    enabled: true
    namespaceDefaults: true
    allowTunnel: true
    # Mattermost is the only cross-namespace caller. The chart additionally
    # permits the dedicated cloudflared connector for Zero Trust traffic.
    allowedNamespaces:
      - mattermost
    tunnelNamespace: mcp-tunnel

servers:
  # Official image. Registry lookups are tokenless; HCP Terraform
  # (workspaces/runs/stacks) needs TFE_TOKEN from mcp-terraform-hcp. TFE_ADDRESS
  # is fixed server-side (per-request overrides are rejected 403).
  terraform:
    enabled: true
    image:
      deployParameter: mcp_terraform_image
      pullPolicy: IfNotPresent
    port: 8080
    args:
      - "streamable-http"
      - "--transport-host"
      - "0.0.0.0"
      - "--transport-port"
      - "8080"
      - "--mcp-endpoint"
      - "/mcp"
      - "--toolsets"
      - "registry,terraform"
    env:
      MCP_ALLOWED_ORIGINS: "https://yourown.chat"
      TFE_ADDRESS: "https://app.terraform.io"
    secretEnvFrom: mcp-terraform-hcp
    health:
      path: /health

  # Our reproducible image contains pinned
  # @google-cloud/observability-mcp + supergateway packages and is built by the
  # MCP release trigger into Artifact Registry. Cloud Deploy replaces the
  # marker below with the immutable image digest produced by that build.
  # Keyless: the mcp-servers KSA -> `mcp` GSA supplies ADC.
  google-cloud:
    enabled: true
    serviceAccountName: mcp-servers
    image:
      deployParameter: mcp_google_cloud_image
      pullPolicy: IfNotPresent
    port: 8080
    args:
      - "--stdio"
      - "node /app/node_modules/@google-cloud/observability-mcp/dist/bundle.js"
      - "--outputTransport"
      - "streamableHttp"
      - "--stateful"
      - "--port"
      - "8080"
      - "--healthEndpoint"
      - "/healthz"
    env:
      GOOGLE_CLOUD_PROJECT: "yourown-chat"
      GOOGLE_CLOUD_QUOTA_PROJECT: "yourown-chat"
      HOME: /tmp
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    health:
      path: /healthz

  # Community transport adapter over Meta's official WhatsApp Business Cloud
  # API. This is not a WhatsApp Web/QR bridge. Account credentials are injected
  # from Secret Manager and the pod is reachable only by Mattermost/tunnel.
  whatsapp-business:
    enabled: true
    image:
      deployParameter: mcp_whatsapp_business_image
      pullPolicy: IfNotPresent
    port: 3000
    env:
      PORT: "3000"
      WHATSAPP_API_VERSION: "v23.0"
    secretEnvFrom: mcp-whatsapp-business
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    health:
      path: /health
