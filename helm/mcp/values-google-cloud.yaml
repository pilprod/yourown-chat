# google-cloud-only release in namespace mcp-google-cloud. This is the only
# release that creates the Workload Identity Kubernetes ServiceAccount.
tunnel:
  enabled: false

defaults:
  networkPolicy:
    # ADC uses Workload Identity Federation through the node-local GKE
    # metadata server. Keep this exception scoped to this release/namespace.
    allowGkeMetadata: true

servers:
  terraform:
    enabled: false
  terraform-stacks:
    enabled: false
  whatsapp-business:
    enabled: false
  whatsapp-personal:
    enabled: false
