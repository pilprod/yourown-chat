# Ephemeral MCP instances share the isolated dev tenant with dev Mattermost
# and its persistent migration-test database. Production MCP servers retain
# one namespace per server.
namePrefix: "dev-"

agentRegistry:
  enabled: false

defaults:
  priorityClassName: development
  networkPolicy:
    enabled: true
    namespaceDefaults: false
    allowTunnel: false
    allowedNamespaces: []
    tunnelNamespace: mcp-tunnel

servers:
  # The disposable server has a separate observability-only GSA. It cannot
  # promote or approve production releases, even if the pod is compromised.
  google-cloud:
    gcpServiceAccountDeployParameter: mcp_google_cloud_dev_gsa
    env:
      GOOGLE_CLOUD_DEPLOY_ENABLED: "false"
  # Dev webhook data is disposable and disappears with the pod. Production
  # keeps the bounded message index on its dedicated PVC.
  whatsapp-business:
    persistence:
      enabled: false
    volumeMounts:
      - name: data
        mountPath: /var/lib/whatsapp-mcp
    volumes:
      - name: data
        emptyDir: {}
  # Never open a second linked-device connection from the disposable dev
  # release. It validates the MCP process/protocol only; QR linking is prod-only.
  whatsapp-personal:
    env:
      PORT: "3000"
      WHATSAPP_PERSONAL_CONNECT_ENABLED: "false"
      WHATSAPP_PERSONAL_DATA_DIR: /var/lib/whatsapp-personal
      WHATSAPP_PERSONAL_MESSAGE_RETENTION: "100"
      WHATSAPP_PERSONAL_HOURLY_LIMIT: "6"
      WHATSAPP_PERSONAL_DAILY_LIMIT: "20"
      WHATSAPP_PERSONAL_MINIMUM_INTERVAL_SECONDS: "30"
      WHATSAPP_PERSONAL_MAXIMUM_UNANSWERED: "2"
    secretProvider:
      enabled: false
    persistence:
      enabled: false
    volumeMounts:
      - name: data
        mountPath: /var/lib/whatsapp-personal
    volumes:
      - name: data
        emptyDir: {}

tunnel:
  enabled: false
