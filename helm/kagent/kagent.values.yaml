# Environment-neutral kagent control-plane contract. Immutable fork image
# coordinates are injected from one reviewed artifact manifest; dev/prod
# overlays own namespaces, identities and model fixtures.
fullnameOverride: kagent

registry: cr.kagent.dev
tag: ""
imagePullPolicy: IfNotPresent

labels:
  app.kubernetes.io/part-of: k8s-agents-platform

rbac:
  # Required fork capability: Terraform owns Roles and RoleBindings.
  create: false

controller:
  replicas: 1
  loglevel: info
  image:
    # registry/repository/digest are injected from the immutable manifest.
    tag: ""
  volumes:
    - name: database-url
      csi:
        driver: secrets-store-gke.csi.k8s.io
        readOnly: true
  volumeMounts:
    - name: database-url
      mountPath: /var/run/secrets/kagent-database
      readOnly: true
  # Human access is protected by the environment's edge authorization route.
  auth:
    mode: unsecure
  substrate:
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    atenetRouterURL: ""
    ateApiServer:
      namespace: ate-system
      serviceAccount: ate-api-server
    tls:
      mode: existingSecret
      serverName: api.ate-system.svc
      existingSecret:
        serverCAKey: server-ca.pem
        clientCredentialBundleKey: client-credential-bundle.pem

ui:
  replicas: 1
  image:
    # registry/repository/digest are injected from the immutable manifest.
    tag: ""
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 20
  service:
    type: ClusterIP
    ports:
      port: 8080
      targetPort: 8080

database:
  postgres:
    urlFile: /var/run/secrets/kagent-database/database-url
    vectorEnabled: false
    bundled:
      enabled: false

providers:
  # Environments start without a model-provider API Secret. E2E uses a
  # deterministic namespace-local fixture; real providers remain opt-in.
  default: ollama
  ollama:
    provider: Ollama
    model: fixture-model

kmcp:
  enabled: false

# Substrate is delivered as its own reviewed release in ate-system.
substrate:
  enabled: false

substrateWorkerPool:
  create: false

kagent-tools:
  enabled: false

grafana-mcp:
  enabled: false

querydoc:
  enabled: false

oauth2-proxy:
  enabled: false

k8s-agent:
  enabled: false

kgateway-agent:
  enabled: false

istio-agent:
  enabled: false

promql-agent:
  enabled: false

observability-agent:
  enabled: false

argo-rollouts-agent:
  enabled: false

helm-agent:
  enabled: false

cilium-policy-agent:
  enabled: false

cilium-manager-agent:
  enabled: false

cilium-debug-agent:
  enabled: false
