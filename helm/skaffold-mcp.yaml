# MCP-only Cloud Deploy render configuration. It owns MCP profiles, protocol
# verification, and dev cleanup without participating in Mattermost routing.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: yourown-chat-mcp

deploy:
  kubectl: {}

profiles:
  # Disposable MCP instances share the isolated, quota-bound dev namespace.
  # Production keeps one namespace per MCP server.
  - name: mcp-dev
    manifests:
      helm:
        releases:
          - name: dev-mcp-terraform
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-terraform.yaml
          - name: dev-mcp-terraform-stacks
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-terraform-stacks.yaml
          - name: dev-mcp-google-cloud
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-google-cloud.yaml
          - name: dev-mcp-whatsapp-business
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-whatsapp-business.yaml
          - name: dev-mcp-whatsapp-personal
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-whatsapp-personal.yaml

  - name: mcp-prod
    manifests:
      helm:
        releases:
          - name: mcp-tunnel
            chartPath: mcp
            namespace: mcp-tunnel
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-tunnel.yaml
          - name: mcp-terraform
            chartPath: mcp
            namespace: mcp-terraform
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-terraform.yaml
          - name: mcp-terraform-stacks
            chartPath: mcp
            namespace: mcp-terraform-stacks
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-terraform-stacks.yaml
          - name: mcp-google-cloud
            chartPath: mcp
            namespace: mcp-google-cloud
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-google-cloud.yaml
          - name: mcp-whatsapp-business
            chartPath: mcp
            namespace: mcp-whatsapp-business
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-whatsapp-business.yaml
    verify:
      - name: mcp-smoke-test
        container:
          name: smoke-test
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              retry='--retry 30 --retry-all-errors --retry-delay 5';
              curl -sSf $retry \
                http://mcp-terraform.mcp-terraform.svc.cluster.local:8080/health
              curl -sSf $retry \
                http://mcp-terraform-stacks.mcp-terraform-stacks.svc.cluster.local:3000/health
              curl -sSf $retry \
                http://mcp-google-cloud.mcp-google-cloud.svc.cluster.local:8080/healthz
              curl -sSf $retry \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/health

              init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"cloud-deploy-prod-smoke","version":"1.0"}}}'

              mcp_api_smoke() {
                name="$1"
                url="$2"
                tool="$3"
                arguments="$4"
                headers="/tmp/${name}.headers"
                body="/tmp/${name}.body"

                echo "[$name] initialize"
                if ! curl -sS --fail-with-body --connect-timeout 5 \
                  --max-time 45 \
                  -D "$headers" -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  --data "$init" "$url"; then
                  echo "[$name] initialize request failed" >&2
                  cat "$body" >&2 || true
                  return 1
                fi
                if ! grep -q '"result"' "$body"; then
                  echo "[$name] initialize returned no result:" >&2
                  cat "$body" >&2
                  return 1
                fi

                session_id="$(grep -i '^mcp-session-id:' "$headers" |
                  tail -n1 | cut -d: -f2- | tr -d ' \r')"
                if [ -z "$session_id" ]; then
                  echo "[$name] initialize returned no Mcp-Session-Id" >&2
                  cat "$headers" >&2
                  return 1
                fi

                echo "[$name] notifications/initialized"
                if ! curl -sS --fail-with-body --connect-timeout 5 \
                  --max-time 45 -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  -H "Mcp-Session-Id: $session_id" \
                  --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                  "$url"; then
                  echo "[$name] initialized notification failed" >&2
                  cat "$body" >&2 || true
                  return 1
                fi

                payload="$(printf \
                  '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"%s","arguments":%s}}' \
                  "$tool" "$arguments")"
                echo "[$name] tools/call $tool"
                if ! curl -sS --fail-with-body --connect-timeout 5 \
                  --max-time 45 -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  -H "Mcp-Session-Id: $session_id" \
                  --data "$payload" "$url"; then
                  echo "[$name] tools/call request failed" >&2
                  cat "$body" >&2 || true
                  return 1
                fi
                if ! grep -q '"result"' "$body" ||
                  grep -Eq '"isError"[[:space:]]*:[[:space:]]*true' "$body" ||
                  grep -Eq '"error"[[:space:]]*:' "$body"; then
                  echo "[$name] tools/call returned an MCP error:" >&2
                  cat "$body" >&2
                  return 1
                fi
                echo "[$name] smoke passed"
              }

              # These are real, read-only upstream API calls. They fail on
              # placeholder/revoked credentials or missing IAM permissions.
              mcp_api_smoke terraform \
                http://mcp-terraform.mcp-terraform.svc.cluster.local:8080/mcp \
                list_terraform_orgs '{}'
              mcp_api_smoke terraform-stacks \
                http://mcp-terraform-stacks.mcp-terraform-stacks.svc.cluster.local:3000/mcp \
                list_deployment_runs '{"pending_only":true}'
              mcp_api_smoke terraform-stack-settings \
                http://mcp-terraform-stacks.mcp-terraform-stacks.svc.cluster.local:3000/mcp \
                get_stack_settings '{"stack_name":"platform-gcp"}'
              mcp_api_smoke google-cloud \
                http://mcp-google-cloud.mcp-google-cloud.svc.cluster.local:8080/mcp \
                list_log_names '{"parent":"projects/yourown-chat","pageSize":1}'
              mcp_api_smoke whatsapp-business \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/mcp \
                account_get_phone_number '{}'
              # Exercise the production message index on its mounted PVC as a
              # separate MCP session. This catches missing/unreadable storage,
              # not only valid Meta credentials.
              mcp_api_smoke whatsapp-message-store \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/mcp \
                messages_list '{"limit":1}'

        executionMode:
          kubernetesCluster:
            jobManifestPath: mcp/verify/prod-job.yaml

  # Opt-in production profile for the unofficial QR-linked personal client.
  # Keep it outside mcp-prod until a static residential/mobile proxy secret is
  # configured. Enabling it adds both the workload and its credential smoke.
  - name: mcp-whatsapp-personal-prod
    manifests:
      helm:
        releases:
          - name: mcp-whatsapp-personal
            chartPath: mcp
            namespace: mcp-whatsapp-personal
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-whatsapp-personal.yaml
    verify:
      - name: mcp-whatsapp-personal-smoke-test
        container:
          name: whatsapp-personal-smoke-test
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              retry='--retry 30 --retry-all-errors --retry-delay 5'
              url=http://mcp-whatsapp-personal.mcp-whatsapp-personal.svc.cluster.local:3000
              curl -sSf $retry "$url/health"

              init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"cloud-deploy-prod-smoke","version":"1.0"}}}'
              headers=/tmp/whatsapp-personal.headers
              body=/tmp/whatsapp-personal.body
              curl -sS --fail-with-body --connect-timeout 5 --max-time 45 \
                -D "$headers" -o "$body" -X POST \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                -H 'Origin: https://yourown.chat' \
                --data "$init" "$url/mcp"
              session_id="$(grep -i '^mcp-session-id:' "$headers" |
                tail -n1 | cut -d: -f2- | tr -d ' \r')"
              test -n "$session_id"
              curl -sS --fail-with-body --connect-timeout 5 --max-time 45 \
                -o "$body" -X POST \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                -H 'Origin: https://yourown.chat' \
                -H "Mcp-Session-Id: $session_id" \
                --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                "$url/mcp"
              curl -sS --fail-with-body --connect-timeout 5 --max-time 45 \
                -o "$body" -X POST \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                -H 'Origin: https://yourown.chat' \
                -H "Mcp-Session-Id: $session_id" \
                --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"session_status","arguments":{}}}' \
                "$url/mcp"
              if ! grep -q '"result"' "$body" ||
                grep -Eq '"isError"[[:space:]]*:[[:space:]]*true|"error"[[:space:]]*:' "$body" ||
                grep -q '"configuration_error"' "$body"; then
                echo "[whatsapp-personal] protocol or static proxy credential smoke failed" >&2
                cat "$body" >&2
                exit 1
              fi
        executionMode:
          kubernetesCluster:
            jobManifestPath: mcp/verify/prod-whatsapp-personal-job.yaml

# Cloud Deploy executes these lifecycle actions in Cloud Build, not as pods in
# GKE. PREDEPLOY cleanup uses its dedicated cleanup identity. POSTDEPLOY
# capability sync refreshes the Cloudflare catalog after every verified
# production rollout so catalog or OAuth regressions are caught immediately.
customActions:
  # Run only after protocol/credential verify succeeds. The execution SA reads
  # one narrowly scoped Secret Manager value; the Cloudflare token never enters
  # Kubernetes or rendered manifests.
  - name: sync-cloudflare-mcp-capabilities
    containers:
      - name: sync-cloudflare-mcp-capabilities
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        command: ["/bin/bash", "-ceu"]
        args:
          - |
            credential_file="$(mktemp)"
            trap 'rm -f "$credential_file"' EXIT
            gcloud secrets versions access latest \
              --secret=cloudflare-mcp-capability-sync \
              > "$credential_file"

            python3 - "$credential_file" <<'PY'
            import json
            import sys
            import time
            import urllib.error
            import urllib.parse
            import urllib.request

            with open(sys.argv[1], encoding="utf-8") as handle:
                credential = json.load(handle)

            account_id = credential["account_id"]
            token = credential["api_token"]
            server_ids = credential["server_ids"]
            root = (
                "https://api.cloudflare.com/client/v4/accounts/"
                f"{urllib.parse.quote(account_id, safe='')}"
                "/access/ai-controls/mcp/servers"
            )
            headers = {
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
            }

            def request(url, method="GET"):
                call = urllib.request.Request(url, method=method, headers=headers)
                try:
                    with urllib.request.urlopen(call, timeout=60) as response:
                        payload = json.load(response)
                except urllib.error.HTTPError as error:
                    body = error.read().decode("utf-8", errors="replace")
                    raise RuntimeError(
                        f"Cloudflare {method} failed ({error.code}): {body}"
                    ) from error
                if not payload.get("success", False):
                    raise RuntimeError(
                        f"Cloudflare {method} failed: {payload.get('errors', payload)}"
                    )
                return payload.get("result") or {}

            for server_id in server_ids:
                encoded_id = urllib.parse.quote(server_id, safe="")
                server_url = f"{root}/{encoded_id}"
                result = request(f"{server_url}/sync", method="POST")
                status = result.get("status")
                print(f"{server_id}: sync requested, status={status}", flush=True)

                deadline = time.monotonic() + 120
                while status == "waiting" and time.monotonic() < deadline:
                    time.sleep(5)
                    result = request(server_url)
                    status = result.get("status")

                if status != "ready":
                    details = result.get("error_details") or result.get("error")
                    raise RuntimeError(
                        f"{server_id}: capability sync ended in {status}: {details}"
                    )

                tools = result.get("tools") or []
                prompts = result.get("prompts") or []
                print(
                    f"{server_id}: ready, tools={len(tools)}, prompts={len(prompts)}",
                    flush=True,
                )
            PY

  - name: cleanup-mcp-dev
    containers:
      - name: cleanup-mcp-dev
        image: gcr.io/cloud-builders/kubectl@sha256:3744bfd3765ac2a09133a164fcd74c8468fac192af8accadbdfbccbb20643961
        command: ["/bin/sh", "-ceu"]
        args:
          - |
            cluster_name="${GKE_CLUSTER##*/}"
            cluster_parent="${GKE_CLUSTER%/clusters/*}"
            cluster_location="${cluster_parent##*/}"
            cluster_project_path="${cluster_parent%/locations/*}"
            cluster_project="${cluster_project_path##*/}"
            gcloud container clusters get-credentials "${cluster_name}" \
              --project "${cluster_project}" \
              --location "${cluster_location}"
            kubectl --namespace dev scale deployment/dev-mcp-terraform --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-terraform-stacks --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-google-cloud --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-whatsapp-business --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-whatsapp-personal --replicas=0
