# MCP-only Cloud Deploy render configuration. It owns MCP profiles, protocol
# verification, and dev cleanup without participating in Mattermost routing.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: yourown-chat-mcp

deploy:
  kubectl: {}

profiles:
  # Disposable MCP instances share the isolated, quota-bound dev namespace.
  # Production keeps one namespace per MCP server.
  - name: mcp-dev
    manifests:
      helm:
        releases:
          - name: dev-mcp-terraform
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-terraform.yaml
          - name: dev-mcp-terraform-stacks
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-terraform-stacks.yaml
          - name: dev-mcp-google-cloud
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-google-cloud.yaml
          - name: dev-mcp-whatsapp-business
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-whatsapp-business.yaml
          - name: dev-mcp-whatsapp-personal
            chartPath: mcp
            namespace: dev
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-dev.yaml
              - mcp/values-whatsapp-personal.yaml

  - name: mcp-prod
    manifests:
      helm:
        releases:
          - name: mcp-tunnel
            chartPath: mcp
            namespace: mcp-tunnel
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-tunnel.yaml
          - name: mcp-terraform
            chartPath: mcp
            namespace: mcp-terraform
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-terraform.yaml
          - name: mcp-terraform-stacks
            chartPath: mcp
            namespace: mcp-terraform-stacks
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-terraform-stacks.yaml
          - name: mcp-google-cloud
            chartPath: mcp
            namespace: mcp-google-cloud
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-google-cloud.yaml
          - name: mcp-whatsapp-business
            chartPath: mcp
            namespace: mcp-whatsapp-business
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-whatsapp-business.yaml
          - name: mcp-whatsapp-personal
            chartPath: mcp
            namespace: mcp-whatsapp-personal
            createNamespace: false
            valuesFiles:
              - mcp/values.yaml
              - mcp/values-whatsapp-personal.yaml
    verify:
      - name: mcp-smoke-test
        container:
          name: smoke-test
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              retry='--retry 30 --retry-all-errors --retry-delay 5';
              curl -sSf $retry \
                http://mcp-terraform.mcp-terraform.svc.cluster.local:8080/health
              curl -sSf $retry \
                http://mcp-terraform-stacks.mcp-terraform-stacks.svc.cluster.local:3000/health
              curl -sSf $retry \
                http://mcp-google-cloud.mcp-google-cloud.svc.cluster.local:8080/healthz
              curl -sSf $retry \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/health
              curl -sSf $retry \
                http://mcp-whatsapp-personal.mcp-whatsapp-personal.svc.cluster.local:3000/health

              init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"cloud-deploy-prod-smoke","version":"1.0"}}}'

              mcp_api_smoke() {
                name="$1"
                url="$2"
                tool="$3"
                arguments="$4"
                headers="/tmp/${name}.headers"
                body="/tmp/${name}.body"

                echo "[$name] initialize"
                if ! curl -sS --fail-with-body --connect-timeout 5 \
                  --max-time 45 \
                  -D "$headers" -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  --data "$init" "$url"; then
                  echo "[$name] initialize request failed" >&2
                  cat "$body" >&2 || true
                  return 1
                fi
                if ! grep -q '"result"' "$body"; then
                  echo "[$name] initialize returned no result:" >&2
                  cat "$body" >&2
                  return 1
                fi

                session_id="$(grep -i '^mcp-session-id:' "$headers" |
                  tail -n1 | cut -d: -f2- | tr -d ' \r')"
                if [ -z "$session_id" ]; then
                  echo "[$name] initialize returned no Mcp-Session-Id" >&2
                  cat "$headers" >&2
                  return 1
                fi

                echo "[$name] notifications/initialized"
                if ! curl -sS --fail-with-body --connect-timeout 5 \
                  --max-time 45 -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  -H "Mcp-Session-Id: $session_id" \
                  --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                  "$url"; then
                  echo "[$name] initialized notification failed" >&2
                  cat "$body" >&2 || true
                  return 1
                fi

                payload="$(printf \
                  '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"%s","arguments":%s}}' \
                  "$tool" "$arguments")"
                echo "[$name] tools/call $tool"
                if ! curl -sS --fail-with-body --connect-timeout 5 \
                  --max-time 45 -o "$body" -X POST \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -H 'Origin: https://yourown.chat' \
                  -H "Mcp-Session-Id: $session_id" \
                  --data "$payload" "$url"; then
                  echo "[$name] tools/call request failed" >&2
                  cat "$body" >&2 || true
                  return 1
                fi
                if ! grep -q '"result"' "$body" ||
                  grep -Eq '"isError"[[:space:]]*:[[:space:]]*true' "$body" ||
                  grep -Eq '"error"[[:space:]]*:' "$body"; then
                  echo "[$name] tools/call returned an MCP error:" >&2
                  cat "$body" >&2
                  return 1
                fi
                echo "[$name] smoke passed"
              }

              # These are real, read-only upstream API calls. They fail on
              # placeholder/revoked credentials or missing IAM permissions.
              mcp_api_smoke terraform \
                http://mcp-terraform.mcp-terraform.svc.cluster.local:8080/mcp \
                list_terraform_orgs '{}'
              mcp_api_smoke terraform-stacks \
                http://mcp-terraform-stacks.mcp-terraform-stacks.svc.cluster.local:3000/mcp \
                terraform_stacks_list_deployment_runs '{"pending_only":true}'
              mcp_api_smoke terraform-stack-settings \
                http://mcp-terraform-stacks.mcp-terraform-stacks.svc.cluster.local:3000/mcp \
                terraform_stacks_get_stack_settings '{"stack_name":"platform-gcp"}'
              mcp_api_smoke google-cloud \
                http://mcp-google-cloud.mcp-google-cloud.svc.cluster.local:8080/mcp \
                list_log_names '{"parent":"projects/yourown-chat","pageSize":1}'
              mcp_api_smoke whatsapp-business \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/mcp \
                whatsapp_get_phone_number '{}'
              # Exercise the production message index on its mounted PVC as a
              # separate MCP session. This catches missing/unreadable storage,
              # not only valid Meta credentials.
              mcp_api_smoke whatsapp-message-store \
                http://mcp-whatsapp-business.mcp-whatsapp-business.svc.cluster.local:3000/mcp \
                whatsapp_list_messages '{"limit":1}'
              # QR linking is an explicit post-deploy operator action. Verify
              # the MCP protocol and persistent kill-switch/status layer
              # without sending a message or requiring a linked account.
              mcp_api_smoke whatsapp-personal \
                http://mcp-whatsapp-personal.mcp-whatsapp-personal.svc.cluster.local:3000/mcp \
                whatsapp_personal_status '{}'
              if grep -q '"configuration_error"' /tmp/whatsapp-personal.body; then
                echo "[whatsapp-personal] static proxy is not configured" >&2
                cat /tmp/whatsapp-personal.body >&2
                exit 1
              fi

        executionMode:
          kubernetesCluster:
            jobManifestPath: mcp/verify/prod-job.yaml

# Cloud Deploy executes this PREDEPLOY action in Cloud Build under the
# dedicated cleanup service account, not as a pod in GKE.
customActions:
  - name: cleanup-mcp-dev
    containers:
      - name: cleanup-mcp-dev
        image: gcr.io/cloud-builders/kubectl@sha256:3744bfd3765ac2a09133a164fcd74c8468fac192af8accadbdfbccbb20643961
        command: ["/bin/sh", "-ceu"]
        args:
          - |
            cluster_name="${GKE_CLUSTER##*/}"
            cluster_parent="${GKE_CLUSTER%/clusters/*}"
            cluster_location="${cluster_parent##*/}"
            cluster_project_path="${cluster_parent%/locations/*}"
            cluster_project="${cluster_project_path##*/}"
            gcloud container clusters get-credentials "${cluster_name}" \
              --project "${cluster_project}" \
              --location "${cluster_location}"
            kubectl --namespace dev scale deployment/dev-mcp-terraform --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-terraform-stacks --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-google-cloud --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-whatsapp-business --replicas=0
            kubectl --namespace dev scale deployment/dev-mcp-whatsapp-personal --replicas=0
