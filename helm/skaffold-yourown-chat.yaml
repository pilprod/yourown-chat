apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: yourown-chat

deploy:
  kubectl: {}

profiles:
  - name: server-pilot
    manifests:
      helm:
        releases:
          - name: yourown-chat
            chartPath: yourown-chat
            namespace: server-edge
            createNamespace: false
            valuesFiles: [yourown-chat/values.yaml]
    verify:
      - name: yourown-chat-identity-smoke
        container:
          name: verify
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 http://api.server-identity.svc.cluster.local:8081/readyz
              curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 http://auth.server-edge.svc.cluster.local:8083/readyz
              curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 http://transport.server-edge.svc.cluster.local:8084/readyz
        executionMode:
          kubernetesCluster:
            jobManifestPath: yourown-chat/verify/job.yaml

customActions:
  - name: cleanup-legacy-server
    containers:
      - name: cleanup-legacy-server
        image: gcr.io/cloud-builders/kubectl@sha256:3744bfd3765ac2a09133a164fcd74c8468fac192af8accadbdfbccbb20643961
        command: ["/bin/sh", "-ceu"]
        args:
          - |
            cluster_name="${GKE_CLUSTER##*/}"
            cluster_parent="${GKE_CLUSTER%/clusters/*}"
            cluster_location="${cluster_parent##*/}"
            cluster_project_path="${cluster_parent%/locations/*}"
            cluster_project="${cluster_project_path##*/}"
            gcloud container clusters get-credentials "${cluster_name}" \
              --project "${cluster_project}" \
              --location "${cluster_location}"
            namespace=yourown-chat-server
            kubectl --namespace "${namespace}" delete deployment \
              yourown-chat-transport-api yourown-chat-auth-api \
              yourown-chat-identity-api yourown-chat-identity-admin \
              yourown-chat-control-api --ignore-not-found
            kubectl --namespace "${namespace}" delete service \
              yourown-chat-transport-api yourown-chat-auth-api \
              yourown-chat-identity-api yourown-chat-identity-admin \
              yourown-chat-control-api yourown-chat-keycloak --ignore-not-found
            kubectl --namespace "${namespace}" delete ingress \
              yourown-chat-keycloak yourown-chat-keycloak-provider \
              yourown-chat-authorization-api yourown-chat-transport-api \
              --ignore-not-found
            kubectl --namespace "${namespace}" delete serviceaccount \
              yourown-chat-transport-api yourown-chat-auth-api \
              yourown-chat-identity-api yourown-chat-identity-admin \
              yourown-chat-identity-migrate yourown-chat-control-api \
              --ignore-not-found
            kubectl --namespace "${namespace}" delete secretproviderclass \
              yourown-chat-transport-api-gcp yourown-chat-auth-api-gcp \
              yourown-chat-identity-api-gcp yourown-chat-identity-admin-gcp \
              yourown-chat-identity-migrate-gcp yourown-chat-control-api-gcp \
              --ignore-not-found
            kubectl --namespace "${namespace}" delete networkpolicy \
              yourown-chat-server-default-deny yourown-chat-transport-api \
              yourown-chat-auth-api yourown-chat-identity-api \
              yourown-chat-identity-admin yourown-chat-identity-migrate \
              yourown-chat-control-api yourown-chat-verify --ignore-not-found
